<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Reuse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Red Hat Display', sans-serif; background-color: #FDFCE5; }
        .bg-cream-input { background-color: #EBEAD2; }
        .text-dark-green { color: #062C1E; }
        .bg-dark-green { background-color: #062C1E; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen relative pb-24 overflow-x-hidden">

    <div id="custom-alert" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-6">
        <div class="bg-[#FDFCE5] w-full max-w-xs rounded-[35px] p-6 text-center border-2 border-[#062C1E]/10 shadow-2xl scale-95 transition-all">
            <div class="w-12 h-12 bg-[#EBEAD2] rounded-full flex items-center justify-center mx-auto mb-4 text-dark-green">
                <i data-lucide="info" class="w-6 h-6"></i>
            </div>
            <h3 id="alert-title" class="font-bold text-dark-green text-lg mb-2">Notification</h3>
            <p id="alert-message" class="text-xs text-gray-500 leading-relaxed mb-6">Message content goes here.</p>
            <button onclick="closeAlert()" class="w-full bg-dark-green text-white font-bold py-3.5 rounded-2xl text-xs tracking-widest active:scale-95 transition-all">
                OKAY
            </button>
        </div>
    </div>
    <div id="filter-overlay" class="fixed inset-0 z-50 bg-black bg-opacity-40 hidden flex justify-center">
        <div class="absolute bottom-0 w-full max-w-md bg-[#FDFCE5] rounded-t-[40px] p-8 animate-slide-up">
            <div class="flex justify-between items-center mb-8">
                <button onclick="toggleFilter()"><i data-lucide="x" class="w-6 h-6"></i></button>
                <h2 class="text-xl font-bold">Filter</h2>
                <button class="text-gray-400 font-bold">Reset</button>
            </div>

            <div class="mb-8">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-lg">Location</h3>
                    <span class="bg-[#D4E89C] text-[10px] font-bold px-3 py-1 rounded-full text-green-800">Primary</span>
                </div>
                
                <div class="bg-white rounded-3xl p-4 flex gap-4 items-center shadow-sm mb-4 relative cursor-pointer">
                    <div class="bg-dark-green p-3 rounded-2xl text-white"><i data-lucide="map-pin" class="w-5 h-5"></i></div>
                    <div class="flex-1 w-full">
                        <select id="univSelect" onchange="changeMapLocation()" class="w-full bg-transparent font-bold text-sm focus:outline-none cursor-pointer appearance-none"></select>
                        <p id="univAddress" class="text-[10px] text-gray-400 mt-1 truncate w-[200px]"></p>
                    </div>
                    <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400 pointer-events-none"></i>
                </div>
                
                <div id="map" class="w-full h-40 bg-gray-200 rounded-3xl relative overflow-hidden flex items-center justify-center shadow-inner z-10"></div>
            </div>

            <div class="mb-8">
                <h3 class="font-bold text-lg mb-4">Area / Campus</h3>
                <div class="space-y-4">
                    <div id="opt-all" onclick="setAreaFilter('all')" class="cursor-pointer bg-[#EBEAD2] border border-transparent p-4 rounded-3xl flex justify-between items-center transition-all">
                        <div class="flex items-center gap-3">
                            <i data-lucide="map" class="w-5 h-5"></i>
                            <span class="text-sm font-bold">All Areas</span>
                        </div>
                        <div id="toggle-all" class="w-10 h-6 bg-gray-300 rounded-full relative p-1 transition-colors">
                            <div class="w-4 h-4 bg-white rounded-full transition-transform translate-x-0"></div>
                        </div>
                    </div>
                    
                    <div id="opt-campus" onclick="setAreaFilter('campus')" class="cursor-pointer bg-[#D4E89C] border border-dark-green p-4 rounded-3xl flex justify-between items-center transition-all">
                        <div class="flex items-center gap-3">
                            <i data-lucide="graduation-cap" class="w-5 h-5"></i>
                            <span class="text-sm font-bold">In-Campus Only</span>
                        </div>
                        <div id="toggle-campus" class="w-10 h-6 bg-dark-green rounded-full relative p-1 transition-colors">
                            <div class="w-4 h-4 bg-white rounded-full transition-transform translate-x-4"></div>
                        </div>
                    </div>
                </div>
            </div>

            <button onclick="applyLocationFilter()" class="w-full bg-dark-green text-white font-bold py-5 rounded-full flex justify-center items-center gap-3 active:scale-95 transition-all">
                Show Results
            </button>
        </div>
    </div>

    <div id="home-view" class="p-6">
        <header class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-2">
                <img src="logo.png" alt="logo" class="w-6 h-6">
                <h1 class="text-xl font-bold text-dark-green flex items-center gap-2 italic">
                    Campus Reuse
                </h1>
            </div>
            <button class="p-2"><i data-lucide="bell" class="w-5 h-5"></i></button>
        </header>

        <button onclick="toggleFilter()" class="flex items-center gap-2 bg-[#EBEAD2] px-4 py-2 rounded-full text-[10px] font-bold mb-6">
            <i data-lucide="map-pin" class="w-3 h-3"></i> <span id="homeLocationDisplay">PETRA CHRISTIAN UNIVERSITY</span> <i data-lucide="chevron-down" class="w-3 h-3"></i>
        </button>

        <div class="relative mb-8">
            <input type="text" onfocus="window.location.href='search.html'" placeholder="Search eco-conscious goods..." 
                class="w-full bg-cream-input p-4 pl-12 rounded-full focus:outline-none placeholder-gray-500 text-sm cursor-text">
            <i data-lucide="search" class="absolute left-5 top-4 w-4 h-4 text-gray-500"></i>
        </div>

        <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold">Browse Categories</h3>
        </div>

        <div id="category-container" class="flex gap-6 mb-10 overflow-x-auto no-scrollbar pb-2"></div>

        <h3 class="font-bold mb-1">Curated for You</h3>
        <p class="text-[10px] text-gray-500 mb-6">Eco-conscious tech picked for your profile</p>

        <div id="product-container" class="space-y-6"></div>
    </div>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-[#EBEAD2]/80 backdrop-blur-md rounded-full p-2 flex justify-between items-center shadow-2xl z-40 border border-white/20">
        <button class="p-3 bg-dark-green text-white rounded-full flex items-center justify-center w-14 h-14"><i data-lucide="home" class="w-5 h-5"></i></button>
        <button onclick="window.location.href='messages.html'" class="p-3 text-gray-600"><i data-lucide="message-circle" class="w-5 h-5"></i></button>
        <button onclick="window.location.href='orders.html'" class="p-3 text-gray-600"><i data-lucide="clipboard-list" class="w-5 h-5"></i></button>
        <button onclick="window.location.href='sell.html'" class="p-3 text-gray-600"><i data-lucide="plus" class="w-5 h-5"></i></button>
        <button onclick="window.location.href='profile.html'" class="p-3 text-gray-600"><i data-lucide="user" class="w-5 h-5"></i></button>
    </nav>

    <script src="db.js"></script>
    <script>
        // --- LOGIK ALERT CUSTOM ---
        function showAlert(message, title = "Notification") {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            
            const overlay = document.getElementById('custom-alert');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            lucide.createIcons();
        }

        function closeAlert() {
            const overlay = document.getElementById('custom-alert');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
        }

        // Modifikasi pengalihan login agar menggunakan alert kustom
        if (!getCurrentUser()) {
            showAlert("Sesi Anda telah berakhir. Silakan login kembali.", "Auth Required");
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        }

        let activeCategory = null; 
        let activeAreaFilter = 'campus'; 

        const campusCategories = [
            { id: "Electronics", icon: "laptop" },
            { id: "Books", icon: "book-open" },
            { id: "Furniture", icon: "armchair" },
            { id: "Apparel", icon: "shirt" },
            { id: "Stationery", icon: "pen-tool" }
        ];

        function renderCategories() {
            const container = document.getElementById('category-container');
            container.innerHTML = '';
            campusCategories.forEach(cat => {
                const isActive = activeCategory === cat.id;
                const bgCircle = isActive ? 'bg-dark-green' : 'bg-[#EBEAD2]';
                const iconColor = isActive ? 'text-white' : 'text-gray-400';
                const textColor = isActive ? 'text-dark-green' : 'text-gray-400';

                container.innerHTML += `
                    <div class="flex flex-col items-center min-w-[70px] cursor-pointer group" onclick="toggleCategory('${cat.id}')">
                        <div class="w-16 h-16 ${bgCircle} rounded-full flex items-center justify-center transition-all group-active:scale-95">
                            <i data-lucide="${cat.icon}" class="w-7 h-7 ${iconColor} transition-colors"></i>
                        </div>
                        <span class="text-[10px] font-bold mt-2 uppercase tracking-tighter ${textColor} transition-colors">${cat.id}</span>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        function toggleCategory(categoryId) {
            activeCategory = activeCategory === categoryId ? null : categoryId;
            renderCategories();
            renderProducts();
        }

        function handleLike(event, productId) {
            event.stopPropagation();
            const liked = toggleLike(productId);
            const btn = event.currentTarget;
            const icon = btn.querySelector('i');
            
            if (liked) {
                icon.setAttribute('fill', '#ef4444');
                icon.setAttribute('stroke', '#ef4444');
                showAlert("Item added to your saved list!", "Saved");
            } else {
                icon.setAttribute('fill', 'none');
                icon.setAttribute('stroke', 'currentColor');
            }
            lucide.createIcons();
        }

        function renderProducts() {
            let products = getProducts();
            const allOrders = getOrders(); 
            
            products = products.filter(p => !allOrders.some(o => o.product_id === p.id));
            
            if (activeCategory) {
                products = products.filter(p => {
                    let itemCat = p.category;
                    if (!itemCat) {
                        if (p.name.includes("Wireless") || p.name.includes("Canon") || p.name.includes("Tofu65")) itemCat = "Electronics";
                        else if (p.name.includes("Lamp")) itemCat = "Furniture";
                        else itemCat = "Others";
                    }
                    return itemCat === activeCategory;
                });
            }

            const container = document.getElementById('product-container');
            container.innerHTML = '';

            if (products.length === 0) {
                container.innerHTML = `
                    <div class="py-10 text-center border border-dashed border-gray-300 rounded-[30px] bg-white/50">
                        <i data-lucide="package-open" class="w-8 h-8 text-gray-300 mx-auto mb-2"></i>
                        <p class="text-sm text-gray-400 font-bold">No items available</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            products.forEach(p => {
                const liked = isLiked(p.id);
                const fillColor = liked ? '#ef4444' : 'none';
                const strokeColor = liked ? '#ef4444' : 'currentColor';
                
                container.innerHTML += `
                    <div class="bg-white rounded-[40px] p-4 shadow-sm cursor-pointer active:scale-95 transition-all" onclick="window.location.href='product-detail.html?id=${p.id}'">
                        <div class="w-full h-80 bg-gray-200 rounded-[30px] mb-4 relative overflow-hidden">
                            <img src="${p.image}" class="w-full h-full object-cover">
                            <button onclick="handleLike(event, ${p.id})" class="absolute top-4 right-4 bg-white p-2 rounded-full shadow">
                                <i data-lucide="heart" class="w-4 h-4" fill="${fillColor}" stroke="${strokeColor}"></i>
                            </button>
                            <span class="absolute bottom-4 left-4 bg-[#D4E89C] text-[8px] font-bold px-3 py-1 rounded-full uppercase">${p.tag || 'AVAILABLE'}</span>
                        </div>
                        <div class="flex justify-between items-center px-2">
                            <div>
                                <h4 class="font-bold text-lg">${p.name}</h4>
                                <p class="text-xs text-gray-400 font-medium truncate w-[180px]">${p.desc}</p>
                            </div>
                            <span class="font-bold text-lg">${formatRupiah(p.price)}</span>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        function getLikes() { return JSON.parse(localStorage.getItem('cm_likes')) || []; }
        function isLiked(productId) {
            const user = getCurrentUser();
            if (!user) return false;
            return getLikes().some(l => l.user_id === user.id && l.product_id === productId);
        }
        function toggleLike(productId) {
            const user = getCurrentUser();
            if (!user) return false;
            let likes = getLikes();
            const idx = likes.findIndex(l => l.user_id === user.id && l.product_id === productId);
            if (idx > -1) likes.splice(idx, 1);
            else likes.push({ user_id: user.id, product_id: productId });
            localStorage.setItem('cm_likes', JSON.stringify(likes));
            return idx === -1; 
        }

        window.onload = () => {
            renderCategories();
            renderProducts();
            
            const user = getCurrentUser();
            if(user) {
                const univData = getUnivDetails(user.univ_id);
                if(univData) document.getElementById('homeLocationDisplay').innerText = univData.name.toUpperCase();
            }
        };

        let map; 
        let marker; 

        function toggleFilter() {
            const overlay = document.getElementById('filter-overlay');
            overlay.classList.toggle('hidden');
            if (!overlay.classList.contains('hidden')) {
                setTimeout(() => {
                    initMap();
                    map.invalidateSize(); 
                }, 100);
            }
        }

        function setAreaFilter(selected) {
            activeAreaFilter = selected; 
            const optAll = document.getElementById('opt-all');
            const toggleAll = document.getElementById('toggle-all');
            const handleAll = toggleAll.querySelector('div');
            const optCampus = document.getElementById('opt-campus');
            const toggleCampus = document.getElementById('toggle-campus');
            const handleCampus = toggleCampus.querySelector('div');

            if (selected === 'all') {
                optAll.className = "cursor-pointer bg-[#D4E89C] border border-dark-green p-4 rounded-3xl flex justify-between items-center transition-all";
                toggleAll.className = "w-10 h-6 bg-dark-green rounded-full relative p-1 transition-colors";
                handleAll.className = "w-4 h-4 bg-white rounded-full transition-transform translate-x-4";
                optCampus.className = "cursor-pointer bg-[#EBEAD2] border border-transparent p-4 rounded-3xl flex justify-between items-center transition-all";
                toggleCampus.className = "w-10 h-6 bg-gray-300 rounded-full relative p-1 transition-colors";
                handleCampus.className = "w-4 h-4 bg-white rounded-full transition-transform translate-x-0";
            } else {
                optAll.className = "cursor-pointer bg-[#EBEAD2] border border-transparent p-4 rounded-3xl flex justify-between items-center transition-all";
                toggleAll.className = "w-10 h-6 bg-gray-300 rounded-full relative p-1 transition-colors";
                handleAll.className = "w-4 h-4 bg-white rounded-full transition-transform translate-x-0";
                optCampus.className = "cursor-pointer bg-[#D4E89C] border border-dark-green p-4 rounded-3xl flex justify-between items-center transition-all";
                toggleCampus.className = "w-10 h-6 bg-dark-green rounded-full relative p-1 transition-colors";
                handleCampus.className = "w-4 h-4 bg-white rounded-full transition-transform translate-x-4";
            }
        }

        function initMap() {
            const univs = getUniversities();
            const selectEl = document.getElementById('univSelect');
            selectEl.innerHTML = ''; 
            
            univs.forEach(u => {
                let option = document.createElement('option');
                option.value = u.id;
                option.text = u.name;
                selectEl.appendChild(option);
            });

            const currentUser = getCurrentUser();
            let activeUniv = getUnivDetails(currentUser ? currentUser.univ_id : 'univ_1');
            if(!activeUniv) activeUniv = univs[0]; 
            
            selectEl.value = activeUniv.id;
            document.getElementById('univAddress').innerText = activeUniv.address;

            if (!map) {
                map = L.map('map').setView([activeUniv.lat, activeUniv.lng], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
                marker = L.marker([activeUniv.lat, activeUniv.lng]).addTo(map).bindPopup(`<b>${activeUniv.name}</b><br>${activeUniv.address}`).openPopup();
            }
        }

        function changeMapLocation() {
            const selectedUnivId = document.getElementById('univSelect').value;
            const univDetails = getUnivDetails(selectedUnivId);
            if(univDetails && map && marker) {
                document.getElementById('univAddress').innerText = univDetails.address;
                map.flyTo([univDetails.lat, univDetails.lng], 16);
                marker.setLatLng([univDetails.lat, univDetails.lng]);
                marker.bindPopup(`<b>${univDetails.name}</b><br>${univDetails.address}`).openPopup();
            }
        }

        function applyLocationFilter() {
            const selectedUnivId = document.getElementById('univSelect').value;
            window.location.href = `search.html?univ=${selectedUnivId}&area=${activeAreaFilter}`;
        }
    </script>
</body>
</html>
