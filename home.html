<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - CampusMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Red Hat Display', sans-serif; background-color: #FDFCE5; }
        .bg-cream-input { background-color: #EBEAD2; }
        .text-dark-green { color: #062C1E; }
        .bg-dark-green { background-color: #062C1E; }
        .active-nav { background-color: #062C1E; color: white; border-radius: 9999px; padding: 10px; }
        /* Hide scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen relative pb-24 overflow-x-hidden">

    <div id="filter-overlay" class="fixed inset-0 z-50 bg-black bg-opacity-40 hidden flex justify-center">
        <div class="absolute bottom-0 w-full max-w-md bg-[#FDFCE5] rounded-t-[40px] p-8 animate-slide-up">
            <div class="flex justify-between items-center mb-8">
                <button onclick="toggleFilter()"><i data-lucide="x" class="w-6 h-6"></i></button>
                <h2 class="text-xl font-bold">Filter</h2>
                <button class="text-gray-400 font-bold">Reset</button>
            </div>

            <div class="mb-8">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-lg">Location</h3>
                    <span class="bg-[#D4E89C] text-[10px] font-bold px-3 py-1 rounded-full text-green-800">Primary</span>
                </div>
                
                <div class="bg-white rounded-3xl p-4 flex gap-4 items-center shadow-sm mb-4 relative cursor-pointer">
                    <div class="bg-dark-green p-3 rounded-2xl text-white"><i data-lucide="map-pin" class="w-5 h-5"></i></div>
                    <div class="flex-1 w-full">
                        <select id="univSelect" onchange="changeMapLocation()" class="w-full bg-transparent font-bold text-sm focus:outline-none cursor-pointer appearance-none">
                            </select>
                        <p id="univAddress" class="text-[10px] text-gray-400 mt-1 truncate w-[200px]"></p>
                    </div>
                    <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400 pointer-events-none"></i>
                </div>
                
                <div id="map" class="w-full h-40 bg-gray-200 rounded-3xl relative overflow-hidden flex items-center justify-center shadow-inner z-10">
                    </div>
            </div>

            <div class="mb-8">
                <h3 class="font-bold text-lg mb-4">Area / Campus</h3>
                <div class="space-y-4">
                    
                    <div id="opt-all" onclick="setAreaFilter('all')" class="cursor-pointer bg-[#EBEAD2] border border-transparent p-4 rounded-3xl flex justify-between items-center transition-all">
                        <div class="flex items-center gap-3">
                            <i data-lucide="map" class="w-5 h-5"></i>
                            <span class="text-sm font-bold">All Areas</span>
                        </div>
                        <div id="toggle-all" class="w-10 h-6 bg-gray-300 rounded-full relative p-1 transition-colors">
                            <div class="w-4 h-4 bg-white rounded-full transition-transform translate-x-0"></div>
                        </div>
                    </div>
                    
                    <div id="opt-campus" onclick="setAreaFilter('campus')" class="cursor-pointer bg-[#D4E89C] border border-dark-green p-4 rounded-3xl flex justify-between items-center transition-all">
                        <div class="flex items-center gap-3">
                            <i data-lucide="graduation-cap" class="w-5 h-5"></i>
                            <span class="text-sm font-bold">In-Campus Only</span>
                        </div>
                        <div id="toggle-campus" class="w-10 h-6 bg-dark-green rounded-full relative p-1 transition-colors">
                            <div class="w-4 h-4 bg-white rounded-full transition-transform translate-x-4"></div>
                        </div>
                    </div>

                </div>
            </div>

            <button onclick="toggleFilter(); showSearch();" class="w-full bg-dark-green text-white font-bold py-5 rounded-full flex justify-center items-center gap-3 active:scale-95 transition-all">
                Show Results
            </button>
        </div>
    </div>

    <div id="home-view" class="p-6">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-dark-green flex items-center gap-2 italic">
                <i data-lucide="leaf" class="w-5 h-5"></i> CampusMarket
            </h1>
            <button class="p-2"><i data-lucide="bell" class="w-5 h-5"></i></button>
        </header>

        <button onclick="toggleFilter()" class="flex items-center gap-2 bg-[#EBEAD2] px-4 py-2 rounded-full text-[10px] font-bold mb-6">
            <i data-lucide="map-pin" class="w-3 h-3"></i> PETRA CHRISTIAN UNIVERSITY <i data-lucide="chevron-down" class="w-3 h-3"></i>
        </button>

        <div class="relative mb-8">
            <input type="text" id="homeSearchInput" onfocus="showSearch()" placeholder="Search eco-conscious goods..." 
                class="w-full bg-cream-input p-4 pl-12 rounded-full focus:outline-none placeholder-gray-500 text-sm">
            <i data-lucide="search" class="absolute left-5 top-4 w-4 h-4 text-gray-500"></i>
        </div>

        <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold">Browse Categories</h3>
            <!-- <button class="text-[10px] font-bold">See all</button> -->
        </div>

        <div id="category-container" class="flex gap-6 mb-10 overflow-x-auto no-scrollbar pb-2">
        </div>

        <h3 class="font-bold mb-1">Curated for You</h3>
        <p class="text-[10px] text-gray-500 mb-6">Eco-conscious tech picked for your profile</p>

        <div id="product-container" class="space-y-6">
        </div>
    </div>

    <div id="search-view" class="p-6 hidden">
        <div class="flex items-center gap-4 mb-6">
            <button onclick="hideSearch()" class="p-2"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
            <div class="relative flex-1">
                <input type="text" id="searchInput" oninput="performSearch()" placeholder="Search items..." class="w-full bg-cream-input p-4 pl-12 rounded-full focus:outline-none text-sm font-medium">
                <i data-lucide="search" class="absolute left-5 top-4 w-4 h-4 text-gray-500"></i>
            </div>
            <button onclick="toggleFilter()" class="p-2"><i data-lucide="sliders-horizontal" class="w-5 h-5"></i></button>
        </div>

        <h3 class="font-bold text-sm mb-4">Recent Searches</h3>
        <div class="flex flex-wrap gap-2 mb-10">
            <span onclick="setSearch('Vintage')" class="bg-[#EBEAD2] px-4 py-2 rounded-full text-xs font-medium cursor-pointer">Vintage</span>
            <span onclick="setSearch('Keyboard')" class="bg-[#EBEAD2] px-4 py-2 rounded-full text-xs font-medium cursor-pointer">Keyboard</span>
            <span onclick="setSearch('Chair')" class="bg-[#EBEAD2] px-4 py-2 rounded-full text-xs font-medium cursor-pointer">Chair</span>
        </div>

        <div class="flex justify-between items-end mb-6">
            <h2 id="searchTitle" class="text-2xl font-bold leading-tight text-dark-green">Search<br>Products</h2>
            <span id="searchCount" class="text-[10px] text-gray-400 font-bold text-right">0 items<br>found</span>
        </div>

        <div id="searchResultsContainer" class="grid grid-cols-1 gap-6">
            </div>
    </div>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-[#EBEAD2]/80 backdrop-blur-md rounded-full p-2 flex justify-between items-center shadow-2xl z-40 border border-white/20">
        <button onclick="hideSearch()" class="p-3 bg-dark-green text-white rounded-full flex items-center justify-center w-14 h-14"><i data-lucide="home" class="w-5 h-5"></i></button>
        <button onclick="window.location.href='messages.html'" class="p-3 text-gray-400"><i data-lucide="message-circle" class="w-5 h-5"></i></button>
        <button onclick="window.location.href='orders.html'" class="p-3 text-gray-400"><i data-lucide="clipboard-list" class="w-5 h-5"></i></button>
        <button onclick="window.location.href='sell.html'" class="p-3 text-gray-400"><i data-lucide="plus" class="w-5 h-5"></i></button>
        <button onclick="window.location.href='profile.html'" class="p-3 text-gray-400"><i data-lucide="user" class="w-5 h-5"></i></button>
    </nav>

    <script src="db.js"></script>
    <script>
        // proteksi halaman (harus login dulu)
        if (!getCurrentUser()) {
            window.location.href = 'login.html';
        }

        // --- SISTEM KATEGORI DINAMIS ---
        let activeCategory = null; // Default: tidak ada yang difilter

        // Daftar kategori yang masuk akal untuk kampus
        const campusCategories = [
            { id: "Electronics", icon: "laptop" },
            { id: "Books", icon: "book-open" },
            { id: "Furniture", icon: "armchair" },
            { id: "Apparel", icon: "shirt" }, // Pakaian/Thrift
            { id: "Stationery", icon: "pen-tool" } // Alat gambar/tulis
        ];

        function renderCategories() {
            const container = document.getElementById('category-container');
            container.innerHTML = '';

            campusCategories.forEach(cat => {
                // Cek apakah kategori ini sedang aktif
                const isActive = activeCategory === cat.id;
                
                // Styling berdasarkan status aktif/tidak
                const bgCircle = isActive ? 'bg-dark-green' : 'bg-[#EBEAD2]';
                const iconColor = isActive ? 'text-white' : 'text-gray-400';
                const textColor = isActive ? 'text-dark-green' : 'text-gray-400';

                container.innerHTML += `
                    <div class="flex flex-col items-center min-w-[70px] cursor-pointer group" onclick="toggleCategory('${cat.id}')">
                        <div class="w-16 h-16 ${bgCircle} rounded-full flex items-center justify-center transition-all group-active:scale-95">
                            <i data-lucide="${cat.icon}" class="w-7 h-7 ${iconColor} transition-colors"></i>
                        </div>
                        <span class="text-[10px] font-bold mt-2 uppercase tracking-tighter ${textColor} transition-colors">${cat.id}</span>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        function toggleCategory(categoryId) {
            // Jika yang diklik adalah kategori yang sudah aktif, matikan filternya (jadi null)
            if (activeCategory === categoryId) {
                activeCategory = null;
            } else {
                // Jika tidak, setel sebagai kategori aktif
                activeCategory = categoryId;
            }
            
            // Render ulang kategori (untuk ubah warna) dan produk (untuk filter)
            renderCategories();
            renderProducts();
        }
        // -------------------------------

        function handleLike(event, productId) {
            event.stopPropagation();
            const liked = toggleLike(productId);
            const btn = event.currentTarget;
            const icon = btn.querySelector('i');
            
            if (liked) {
                icon.setAttribute('fill', '#ef4444');
                icon.setAttribute('stroke', '#ef4444');
            } else {
                icon.setAttribute('fill', 'none');
                icon.setAttribute('stroke', 'currentColor');
            }
            lucide.createIcons();
        }

        function renderProducts() {
            let products = getProducts();
            
            // --- LOGIKA FILTER PRODUK ---
            if (activeCategory) {
                products = products.filter(p => {
                    // Karena data default di db.js belum punya 'category', 
                    // kita berikan fallback sementara berdasarkan namanya agar demo tetap berjalan.
                    let itemCat = p.category;
                    if (!itemCat) {
                        if (p.name.includes("Wireless") || p.name.includes("Canon") || p.name.includes("Tofu65")) itemCat = "Electronics";
                        else if (p.name.includes("Lamp")) itemCat = "Furniture";
                        else itemCat = "Others";
                    }
                    return itemCat === activeCategory;
                });
            }
            // ----------------------------

            const container = document.getElementById('product-container');
            container.innerHTML = '';

            // Jika kosong setelah difilter
            if (products.length === 0) {
                container.innerHTML = `
                    <div class="py-10 text-center border border-dashed border-gray-300 rounded-[30px] bg-white/50">
                        <i data-lucide="package-open" class="w-8 h-8 text-gray-300 mx-auto mb-2"></i>
                        <p class="text-sm text-gray-400 font-bold">No items in ${activeCategory}</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            products.forEach(p => {
                const liked = isLiked(p.id);
                const fillColor = liked ? '#ef4444' : 'none';
                const strokeColor = liked ? '#ef4444' : 'currentColor';
                
                container.innerHTML += `
                    <div class="bg-white rounded-[40px] p-4 shadow-sm cursor-pointer active:scale-95 transition-all" 
                        onclick="window.location.href='product-detail.html?id=${p.id}'">
                        <div class="w-full h-80 bg-gray-200 rounded-[30px] mb-4 relative overflow-hidden">
                            <img src="${p.image}" class="w-full h-full object-cover">
                            <button onclick="handleLike(event, ${p.id})" class="absolute top-4 right-4 bg-white p-2 rounded-full shadow">
                                <i data-lucide="heart" class="w-4 h-4" fill="${fillColor}" stroke="${strokeColor}"></i>
                            </button>
                            <span class="absolute bottom-4 left-4 bg-[#D4E89C] text-[8px] font-bold px-3 py-1 rounded-full uppercase">${p.tag}</span>
                        </div>
                        <div class="flex justify-between items-center px-2">
                            <div>
                                <h4 class="font-bold text-lg">${p.name}</h4>
                                <p class="text-xs text-gray-400 font-medium">${p.desc}</p>
                            </div>
                            <span class="font-bold text-lg">$${p.price}</span>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        function getLikes() {
            return JSON.parse(localStorage.getItem('cm_likes')) || [];
        }

        function isLiked(productId) {
            const user = getCurrentUser();
            if (!user) return false;
            return getLikes().some(l => l.user_id === user.id && l.product_id === productId);
        }

        function toggleLike(productId) {
            const user = getCurrentUser();
            if (!user) return false;
            let likes = getLikes();
            const idx = likes.findIndex(l => l.user_id === user.id && l.product_id === productId);
            if (idx > -1) {
                likes.splice(idx, 1);
            } else {
                likes.push({ user_id: user.id, product_id: productId });
            }
            localStorage.setItem('cm_likes', JSON.stringify(likes));
            return idx === -1; 
        }

        // Panggil kedua fungsi render saat halaman dimuat
        window.onload = () => {
            renderCategories();
            renderProducts();
        };
    </script>

    <script>
        lucide.createIcons();

        function toggleFilter() {
            const overlay = document.getElementById('filter-overlay');
            overlay.classList.toggle('hidden');
        }

        // Fungsi untuk mengganti pilihan filter area
        function setAreaFilter(selected) {
            const optAll = document.getElementById('opt-all');
            const toggleAll = document.getElementById('toggle-all');
            const handleAll = toggleAll.querySelector('div');

            const optCampus = document.getElementById('opt-campus');
            const toggleCampus = document.getElementById('toggle-campus');
            const handleCampus = toggleCampus.querySelector('div');

            if (selected === 'all') {
                // Nyalakan All Areas
                optAll.className = "cursor-pointer bg-[#D4E89C] border border-dark-green p-4 rounded-3xl flex justify-between items-center transition-all";
                toggleAll.className = "w-10 h-6 bg-dark-green rounded-full relative p-1 transition-colors";
                handleAll.className = "w-4 h-4 bg-white rounded-full transition-transform translate-x-4";

                // Matikan In-Campus
                optCampus.className = "cursor-pointer bg-[#EBEAD2] border border-transparent p-4 rounded-3xl flex justify-between items-center transition-all";
                toggleCampus.className = "w-10 h-6 bg-gray-300 rounded-full relative p-1 transition-colors";
                handleCampus.className = "w-4 h-4 bg-white rounded-full transition-transform translate-x-0";
            } else {
                // Matikan All Areas
                optAll.className = "cursor-pointer bg-[#EBEAD2] border border-transparent p-4 rounded-3xl flex justify-between items-center transition-all";
                toggleAll.className = "w-10 h-6 bg-gray-300 rounded-full relative p-1 transition-colors";
                handleAll.className = "w-4 h-4 bg-white rounded-full transition-transform translate-x-0";

                // Nyalakan In-Campus
                optCampus.className = "cursor-pointer bg-[#D4E89C] border border-dark-green p-4 rounded-3xl flex justify-between items-center transition-all";
                toggleCampus.className = "w-10 h-6 bg-dark-green rounded-full relative p-1 transition-colors";
                handleCampus.className = "w-4 h-4 bg-white rounded-full transition-transform translate-x-4";
            }
        }

        function showSearch() {
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('search-view').classList.remove('hidden');
        }

        // Fungsi untuk membawa teks dari Home ke Search View
        function transferSearch() {
            const homeInput = document.getElementById('homeSearchInput').value;
            const searchInput = document.getElementById('searchInput');
            
            searchInput.value = homeInput;
            if (homeInput.length > 0) {
                showSearch();
                performSearch(); // Langsung jalankan pencarian
            }
        }

        // Fungsi klik badge "Recent Searches"
        function setSearch(keyword) {
            document.getElementById('searchInput').value = keyword;
            performSearch();
        }

        // Fungsi Utama Pencarian
        function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const products = getProducts(); // Ambil semua data produk dari db.js
            
            // Filter produk berdasarkan nama, deskripsi, atau kategori
            const filteredProducts = products.filter(p => 
                p.name.toLowerCase().includes(query) || 
                p.desc.toLowerCase().includes(query) ||
                (p.category && p.category.toLowerCase().includes(query))
            );

            // 1. Update Teks Judul & Jumlah Hasil
            document.getElementById('searchTitle').innerHTML = query ? `Results for<br>'${query}'` : `Search<br>Products`;
            document.getElementById('searchCount').innerHTML = `${filteredProducts.length} items<br>found`;

            // 2. Tampilkan ke Container
            const container = document.getElementById('searchResultsContainer');
            container.innerHTML = ''; // Bersihkan hasil sebelumnya

            if (filteredProducts.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 text-sm py-10">Oops, no items found for "${query}".</p>`;
                return;
            }

            // 3. Render ulang produk yang cocok (mirip fungsi renderProducts)
            filteredProducts.forEach(p => {
                const liked = isLiked(p.id);
                const fillColor = liked ? '#ef4444' : 'none';
                const strokeColor = liked ? '#ef4444' : 'currentColor';
                
                container.innerHTML += `
                    <div class="bg-white rounded-[35px] p-4 shadow-sm cursor-pointer active:scale-95 transition-all" 
                        onclick="window.location.href='product-detail.html?id=${p.id}'">
                        <div class="w-full h-72 bg-gray-200 rounded-[25px] mb-4 relative overflow-hidden">
                            <img src="${p.image}" class="w-full h-full object-cover">
                            <button onclick="handleLike(event, ${p.id}); performSearch();" class="absolute top-4 right-4 bg-white p-2 rounded-full shadow z-10">
                                <i data-lucide="heart" class="w-4 h-4" fill="${fillColor}" stroke="${strokeColor}"></i>
                            </button>
                            <span class="absolute bottom-4 left-4 bg-[#D4E89C] text-[8px] font-bold px-3 py-1 rounded-full uppercase">${p.tag}</span>
                        </div>
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="font-bold">${p.name}</h4>
                            <span class="font-bold">$${p.price}</span>
                        </div>
                        <p class="text-[10px] text-gray-400 mb-4">${p.desc}</p>
                    </div>
                `;
            });

            // Wajib panggil ulang agar ikon Lucide ter-render
            lucide.createIcons();
        }

        // Sedikit perbaikan untuk hideSearch agar mereset input saat tombol back diklik
        function hideSearch() {
            document.getElementById('search-view').classList.add('hidden');
            document.getElementById('home-view').classList.remove('hidden');
            document.getElementById('homeSearchInput').value = ''; // Reset teks
            document.getElementById('searchInput').value = ''; // Reset teks
        }
    </script>
    <script>
        let map; // Variabel global untuk nyimpan peta
        let marker; // Variabel global untuk nyimpan pin

        function initMap() {
            // Ambil data Univ dari db.js
            const univs = getUniversities();
            const selectEl = document.getElementById('univSelect');
            
            // Isi dropdown dengan opsi kampus
            univs.forEach(u => {
                let option = document.createElement('option');
                option.value = u.id;
                option.text = u.name;
                selectEl.appendChild(option);
            });

            // Set ke Univ user saat ini (default: Petra)
            const currentUser = getCurrentUser();
            let activeUniv = getUnivDetails(currentUser ? currentUser.univ_id : 'univ_1');
            
            if(!activeUniv) activeUniv = univs[0]; // Fallback
            
            selectEl.value = activeUniv.id;
            document.getElementById('univAddress').innerText = activeUniv.address;

            // Inisialisasi Peta (Hanya dieksekusi sekali)
            if (!map) {
                map = L.map('map').setView([activeUniv.lat, activeUniv.lng], 15);
                
                // Pake tile layer dari OpenStreetMap (Gratis, gaya mirip GMaps)
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);

                // Tambahkan Pin Marker
                marker = L.marker([activeUniv.lat, activeUniv.lng]).addTo(map)
                    .bindPopup(`<b>${activeUniv.name}</b><br>${activeUniv.address}`).openPopup();
            }
        }

        // Fungsi dipanggil saat opsi Dropdown Kampus diubah
        function changeMapLocation() {
            const selectedId = document.getElementById('univSelect').value;
            const univDetails = getUnivDetails(selectedId);

            if(univDetails && map && marker) {
                // Update teks alamat
                document.getElementById('univAddress').innerText = univDetails.address;
                
                // Geser peta & marker perlahan ke lokasi baru
                map.flyTo([univDetails.lat, univDetails.lng], 16);
                marker.setLatLng([univDetails.lat, univDetails.lng]);
                marker.bindPopup(`<b>${univDetails.name}</b><br>${univDetails.address}`).openPopup();
            }
        }

        // Modifikasi fungsi toggleFilter untuk memanggil initMap saat dibuka (menghindari bug map blank/abu-abu di Leaflet)
        function toggleFilter() {
            const overlay = document.getElementById('filter-overlay');
            overlay.classList.toggle('hidden');
            
            if (!overlay.classList.contains('hidden')) {
                // Delay sebentar biar DOM siap nge-render ukuran wadah Peta
                setTimeout(() => {
                    initMap();
                    map.invalidateSize(); 
                }, 100);
            }
        }
    </script>
</body>
</html>
