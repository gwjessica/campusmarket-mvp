<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Reuse - Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: 'Red Hat Display', sans-serif; background-color: #FDFCE5; }
        .bg-cream-input { background-color: #EBEAD2; }
        .text-dark-green { color: #062C1E; }
        .bg-dark-green { background-color: #062C1E; }
        /* Hide scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen relative overflow-x-hidden">

    <div id="filter-overlay" class="fixed inset-0 z-50 bg-black bg-opacity-40 hidden flex justify-center">
        <div class="absolute bottom-0 w-full max-w-md bg-[#FDFCE5] rounded-t-[40px] p-8 animate-slide-up overflow-y-auto max-h-[95vh] no-scrollbar">
            <div class="flex justify-between items-center mb-8">
                <button onclick="toggleFilter()"><i data-lucide="x" class="w-6 h-6"></i></button>
                <h2 class="text-xl font-bold">Filter</h2>
                <button onclick="resetFilter()" class="text-gray-400 font-bold active:text-gray-600">Reset</button>
            </div>

            <div class="mb-8">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-lg">Location</h3>
                    <span class="bg-[#D4E89C] text-[10px] font-bold px-3 py-1 rounded-full text-green-800">Primary</span>
                </div>
                
                <div class="bg-white rounded-3xl p-4 flex gap-4 items-center shadow-sm mb-4 relative cursor-pointer">
                    <div class="bg-dark-green p-3 rounded-2xl text-white"><i data-lucide="map-pin" class="w-5 h-5"></i></div>
                    <div class="flex-1 w-full">
                        <select id="univSelect" onchange="changeMapLocation()" class="w-full bg-transparent font-bold text-sm focus:outline-none cursor-pointer appearance-none"></select>
                        <p id="univAddress" class="text-[10px] text-gray-400 mt-1 truncate w-[200px]"></p>
                    </div>
                    <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400 pointer-events-none"></i>
                </div>
                
                <div id="map" class="w-full h-40 bg-gray-200 rounded-3xl relative overflow-hidden flex items-center justify-center shadow-inner z-10"></div>
            </div>

            <div class="mb-8">
                <h3 class="font-bold text-lg mb-4">Area / Campus</h3>
                <div class="space-y-4">
                    <div id="opt-all" onclick="setAreaFilter('all')" class="cursor-pointer bg-[#EBEAD2] border border-transparent p-4 rounded-3xl flex justify-between items-center transition-all">
                        <div class="flex items-center gap-3">
                            <i data-lucide="map" class="w-5 h-5"></i>
                            <span class="text-sm font-bold">All Areas</span>
                        </div>
                        <div id="toggle-all" class="w-10 h-6 bg-gray-300 rounded-full relative p-1 transition-colors">
                            <div class="w-4 h-4 bg-white rounded-full transition-transform translate-x-0"></div>
                        </div>
                    </div>
                    
                    <div id="opt-campus" onclick="setAreaFilter('campus')" class="cursor-pointer bg-[#D4E89C] border border-dark-green p-4 rounded-3xl flex justify-between items-center transition-all">
                        <div class="flex items-center gap-3">
                            <i data-lucide="graduation-cap" class="w-5 h-5"></i>
                            <span class="text-sm font-bold">In-Campus Only</span>
                        </div>
                        <div id="toggle-campus" class="w-10 h-6 bg-dark-green rounded-full relative p-1 transition-colors">
                            <div class="w-4 h-4 bg-white rounded-full transition-transform translate-x-4"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mb-8">
                <div class="flex justify-between items-end mb-4">
                    <h3 class="font-bold text-lg">Categories</h3>
                    <span class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Multiple Select</span>
                </div>
                <div id="filter-category-container" class="flex gap-6 overflow-x-auto no-scrollbar pb-2 pt-1">
                    </div>
            </div>

            <button onclick="applyLocationFilter()" class="w-full bg-dark-green text-white font-bold py-5 rounded-full flex justify-center items-center gap-3 active:scale-95 transition-all">
                Apply Filter
            </button>
        </div>
    </div>

    <div id="search-view" class="flex flex-col min-h-screen">
        
        <div class="sticky top-0 z-40 bg-[#FDFCE5]/95 backdrop-blur-sm px-6 pt-6 pb-4 flex items-center gap-4 border-b border-gray-200/40 shadow-sm">
            <button onclick="window.location.href='home.html'" class="p-2 text-dark-green hover:opacity-70 transition-opacity"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
            <div class="relative flex-1">
                <input type="text" id="searchInput" oninput="performSearch()" placeholder="Search items..." class="w-full bg-cream-input p-4 pl-12 rounded-full focus:outline-none text-sm font-medium" autofocus>
                <i data-lucide="search" class="absolute left-5 top-4 w-4 h-4 text-gray-500"></i>
            </div>
            <button onclick="toggleFilter()" class="p-2 text-dark-green hover:opacity-70 transition-opacity relative">
                <i data-lucide="sliders-horizontal" class="w-5 h-5"></i>
                <span id="filterBadge" class="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-[#FDFCE5] hidden"></span>
            </button>
        </div>

        <div class="px-6 pt-6 pb-32">
            <!-- <h3 class="font-bold text-sm mb-4">Recent Searches</h3>
            <div class="flex flex-wrap gap-2 mb-10">
                <span onclick="setSearch('Vintage')" class="bg-[#EBEAD2] px-4 py-2 rounded-full text-xs font-medium cursor-pointer active:bg-gray-300">Vintage</span>
                <span onclick="setSearch('Keyboard')" class="bg-[#EBEAD2] px-4 py-2 rounded-full text-xs font-medium cursor-pointer active:bg-gray-300">Keyboard</span>
                <span onclick="setSearch('Lamp')" class="bg-[#EBEAD2] px-4 py-2 rounded-full text-xs font-medium cursor-pointer active:bg-gray-300">Lamp</span>
            </div> -->

            <div class="flex justify-between items-end mb-6">
                <div>
                    <h2 id="searchTitle" class="text-2xl font-bold leading-tight text-dark-green">All<br>Products</h2>
                    <p id="searchLocationText" class="text-[10px] text-gray-500 font-bold mt-1 uppercase tracking-widest hidden"></p>
                </div>
                <span id="searchCount" class="text-[10px] text-gray-400 font-bold text-right">0 items<br>found</span>
            </div>

            <div id="searchResultsContainer" class="grid grid-cols-1 gap-6"></div>
        </div>
    </div>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-[#EBEAD2]/80 backdrop-blur-md rounded-full p-2 flex justify-between items-center shadow-2xl z-40 border border-white/20">
        <button onclick="window.location.href='home.html'" class="p-3 text-gray-400"><i data-lucide="home" class="w-5 h-5"></i></button>
        <button onclick="window.location.href='messages.html'" class="p-3 text-gray-400"><i data-lucide="message-circle" class="w-5 h-5"></i></button>
        <button onclick="window.location.href='orders.html'" class="p-3 text-gray-400"><i data-lucide="clipboard-list" class="w-5 h-5"></i></button>
        <button onclick="window.location.href='sell.html'" class="p-3 text-gray-400"><i data-lucide="plus" class="w-5 h-5"></i></button>
        <button onclick="window.location.href='profile.html'" class="p-3 text-gray-400"><i data-lucide="user" class="w-5 h-5"></i></button>
    </nav>

    <script src="db.js"></script>
    <script>
        if (!getCurrentUser()) window.location.href = 'login.html';

        let activeAreaFilter = 'campus'; 
        let globalSelectedUnivId = null;
        let activeCategories = []; // Array untuk menyimpan lebih dari satu kategori

        const campusCategories = [
            { id: "Electronics", icon: "laptop" },
            { id: "Books", icon: "book-open" },
            { id: "Furniture", icon: "armchair" },
            { id: "Apparel", icon: "shirt" }, 
            { id: "Stationery", icon: "pen-tool" } 
        ];

        // --- URL PARAMETER PARSING ---
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const queryParam = urlParams.get('q') || '';
            const areaParam = urlParams.get('area');
            const univParam = urlParams.get('univ');

            if (queryParam) document.getElementById('searchInput').value = queryParam;
            if (areaParam) activeAreaFilter = areaParam;
            if (univParam) globalSelectedUnivId = univParam;

            setAreaFilter(activeAreaFilter); 
            renderFilterCategories(); 
            updateFilterBadge(); // Periksa status badge awal
            performSearch();
            lucide.createIcons();
        });

        // --- UPDATE BADGE FILTER ---
        function updateFilterBadge() {
            const badge = document.getElementById('filterBadge');
            if (activeCategories.length > 0) {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // --- FILTER KATEGORI (MULTIPLE) ---
        function renderFilterCategories() {
            const container = document.getElementById('filter-category-container');
            container.innerHTML = '';

            campusCategories.forEach(cat => {
                const isActive = activeCategories.includes(cat.id);
                
                const bgCircle = isActive ? 'bg-dark-green' : 'bg-[#EBEAD2]';
                const iconColor = isActive ? 'text-white' : 'text-gray-400';
                const textColor = isActive ? 'text-dark-green' : 'text-gray-400';

                container.innerHTML += `
                    <div class="flex flex-col items-center min-w-[65px] cursor-pointer group" onclick="toggleFilterCategory('${cat.id}')">
                        <div class="w-14 h-14 ${bgCircle} rounded-full flex items-center justify-center transition-all group-active:scale-95 shadow-sm">
                            <i data-lucide="${cat.icon}" class="w-6 h-6 ${iconColor} transition-colors"></i>
                        </div>
                        <span class="text-[10px] font-bold mt-2 uppercase tracking-tighter ${textColor} transition-colors text-center w-full truncate">${cat.id}</span>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        function toggleFilterCategory(categoryId) {
            if (activeCategories.includes(categoryId)) {
                activeCategories = activeCategories.filter(id => id !== categoryId);
            } else {
                activeCategories.push(categoryId);
            }
            renderFilterCategories();
            updateFilterBadge(); // Update indikator merah
        }

        function resetFilter() {
            activeCategories = [];
            setAreaFilter('campus');
            
            const currentUser = getCurrentUser();
            globalSelectedUnivId = currentUser ? currentUser.univ_id : 'univ_1';
            
            document.getElementById('univSelect').value = globalSelectedUnivId;
            changeMapLocation();
            renderFilterCategories();
            updateFilterBadge(); // Update indikator merah
        }

        // --- PENCARIAN & FILTERING ---
        function setSearch(keyword) {
            document.getElementById('searchInput').value = keyword;
            performSearch();
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let products = getProducts(); 
            const allUsers = getUsers();
            
            let searchUnivId = globalSelectedUnivId;
            if (!searchUnivId) {
                const user = getCurrentUser();
                searchUnivId = user ? user.univ_id : 'univ_1';
            }
            
            // 1. Logika Filter Lokasi (Campus)
            if (activeAreaFilter === 'campus') {
                products = products.filter(p => {
                    const seller = allUsers.find(u => u.id === p.seller_id);
                    return seller && seller.univ_id === searchUnivId;
                });
            }

            // 2. Logika Filter Kategori (Multiple)
            if (activeCategories.length > 0) {
                products = products.filter(p => {
                    let itemCat = p.category;
                    if (!itemCat) {
                        if (p.name.includes("Wireless") || p.name.includes("Canon") || p.name.includes("Tofu65")) itemCat = "Electronics";
                        else if (p.name.includes("Lamp")) itemCat = "Furniture";
                        else itemCat = "Others";
                    }
                    return activeCategories.includes(itemCat);
                });
            }

            // 3. Logika Filter Teks Input Bar
            const filteredProducts = products.filter(p => 
                p.name.toLowerCase().includes(query) || 
                p.desc.toLowerCase().includes(query) ||
                (p.category && p.category.toLowerCase().includes(query))
            );

            // Update UI Teks
            const searchTitle = document.getElementById('searchTitle');
            const locText = document.getElementById('searchLocationText');
            
            searchTitle.innerHTML = query ? `Results for<br>'${query}'` : `All<br>Products`;

            const univDetails = getUnivDetails(searchUnivId);
            const locationName = univDetails ? univDetails.name : "UNKNOWN AREA";

            locText.innerHTML = activeAreaFilter === 'campus' ? `IN ${locationName}` : `IN ALL SURABAYA AREAS`;
            locText.classList.remove('hidden');
            
            document.getElementById('searchCount').innerHTML = `${filteredProducts.length} items<br>found`;

            // Render ke Container Layar
            const container = document.getElementById('searchResultsContainer');
            container.innerHTML = ''; 

            if (filteredProducts.length === 0) {
                container.innerHTML = `
                    <div class="py-12 text-center border border-dashed border-gray-300 rounded-[30px] bg-white/50">
                        <i data-lucide="box" class="w-8 h-8 text-gray-300 mx-auto mb-2"></i>
                        <p class="text-sm text-gray-500 font-bold">No items found matching your filters.</p>
                        <button onclick="resetFilter(); applyLocationFilter();" class="mt-4 text-[10px] font-bold text-dark-green bg-[#D4E89C] px-4 py-2 rounded-full">Clear Filters</button>
                    </div>`;
                lucide.createIcons();
                return;
            }

            filteredProducts.forEach(p => {
                const liked = isLiked(p.id);
                const fillColor = liked ? '#ef4444' : 'none';
                const strokeColor = liked ? '#ef4444' : 'currentColor';
                
                container.innerHTML += `
                    <div class="bg-white rounded-[35px] p-4 shadow-sm cursor-pointer active:scale-95 transition-all" onclick="window.location.href='product-detail.html?id=${p.id}'">
                        <div class="w-full h-72 bg-gray-200 rounded-[25px] mb-4 relative overflow-hidden">
                            <img src="${p.image}" class="w-full h-full object-cover">
                            <button onclick="handleLike(event, ${p.id}); performSearch();" class="absolute top-4 right-4 bg-white p-2 rounded-full shadow z-10">
                                <i data-lucide="heart" class="w-4 h-4" fill="${fillColor}" stroke="${strokeColor}"></i>
                            </button>
                            <span class="absolute bottom-4 left-4 bg-[#D4E89C] text-[8px] font-bold px-3 py-1 rounded-full uppercase">${p.tag}</span>
                        </div>
                        <div class="flex flex-col justify-center px-2">
                            <div class="flex justify-between items-center w-full mb-2">
                                <h4 class="font-bold text-lg">${p.name}</h4>
                                <span class="font-bold text-lg">${formatRupiah(p.price)}</span>
                                
                            </div>
                            <p class="text-xs text-gray-400 font-medium">${p.desc}</p>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        // --- SISTEM LIKE ---
        function getLikes() { return JSON.parse(localStorage.getItem('cm_likes')) || []; }
        function isLiked(productId) {
            const user = getCurrentUser();
            if (!user) return false;
            return getLikes().some(l => l.user_id === user.id && l.product_id === productId);
        }
        function toggleLike(productId) {
            const user = getCurrentUser();
            let likes = getLikes();
            const idx = likes.findIndex(l => l.user_id === user.id && l.product_id === productId);
            if (idx > -1) likes.splice(idx, 1);
            else likes.push({ user_id: user.id, product_id: productId });
            localStorage.setItem('cm_likes', JSON.stringify(likes));
            return idx === -1; 
        }
        function handleLike(event, productId) {
            event.stopPropagation();
            toggleLike(productId);
        }

        // --- FILTER & MAP LOGIC ---
        let map; let marker; 

        function toggleFilter() {
            const overlay = document.getElementById('filter-overlay');
            overlay.classList.toggle('hidden');
            if (!overlay.classList.contains('hidden')) {
                setTimeout(() => {
                    initMap();
                    map.invalidateSize(); 
                }, 100);
            }
        }

        function setAreaFilter(selected) {
            activeAreaFilter = selected; 
            const optAll = document.getElementById('opt-all');
            const toggleAll = document.getElementById('toggle-all');
            const handleAll = toggleAll.querySelector('div');
            const optCampus = document.getElementById('opt-campus');
            const toggleCampus = document.getElementById('toggle-campus');
            const handleCampus = toggleCampus.querySelector('div');

            if (selected === 'all') {
                optAll.className = "cursor-pointer bg-[#D4E89C] border border-dark-green p-4 rounded-3xl flex justify-between items-center transition-all";
                toggleAll.className = "w-10 h-6 bg-dark-green rounded-full relative p-1 transition-colors";
                handleAll.className = "w-4 h-4 bg-white rounded-full transition-transform translate-x-4";
                optCampus.className = "cursor-pointer bg-[#EBEAD2] border border-transparent p-4 rounded-3xl flex justify-between items-center transition-all";
                toggleCampus.className = "w-10 h-6 bg-gray-300 rounded-full relative p-1 transition-colors";
                handleCampus.className = "w-4 h-4 bg-white rounded-full transition-transform translate-x-0";
            } else {
                optAll.className = "cursor-pointer bg-[#EBEAD2] border border-transparent p-4 rounded-3xl flex justify-between items-center transition-all";
                toggleAll.className = "w-10 h-6 bg-gray-300 rounded-full relative p-1 transition-colors";
                handleAll.className = "w-4 h-4 bg-white rounded-full transition-transform translate-x-0";
                optCampus.className = "cursor-pointer bg-[#D4E89C] border border-dark-green p-4 rounded-3xl flex justify-between items-center transition-all";
                toggleCampus.className = "w-10 h-6 bg-dark-green rounded-full relative p-1 transition-colors";
                handleCampus.className = "w-4 h-4 bg-white rounded-full transition-transform translate-x-4";
            }
        }

        function initMap() {
            const univs = getUniversities();
            const selectEl = document.getElementById('univSelect');
            selectEl.innerHTML = ''; 
            
            univs.forEach(u => {
                let option = document.createElement('option');
                option.value = u.id;
                option.text = u.name;
                selectEl.appendChild(option);
            });

            let activeUniv = getUnivDetails(globalSelectedUnivId);
            if(!activeUniv) {
                const currentUser = getCurrentUser();
                activeUniv = getUnivDetails(currentUser ? currentUser.univ_id : 'univ_1');
            }
            if(!activeUniv) activeUniv = univs[0]; 
            
            selectEl.value = activeUniv.id;
            document.getElementById('univAddress').innerText = activeUniv.address;

            if (!map) {
                map = L.map('map').setView([activeUniv.lat, activeUniv.lng], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
                marker = L.marker([activeUniv.lat, activeUniv.lng]).addTo(map).bindPopup(`<b>${activeUniv.name}</b><br>${activeUniv.address}`).openPopup();
            }
        }

        function changeMapLocation() {
            const selectedUnivId = document.getElementById('univSelect').value;
            const univDetails = getUnivDetails(selectedUnivId);
            if(univDetails && map && marker) {
                document.getElementById('univAddress').innerText = univDetails.address;
                map.flyTo([univDetails.lat, univDetails.lng], 16);
                marker.setLatLng([univDetails.lat, univDetails.lng]);
                marker.bindPopup(`<b>${univDetails.name}</b><br>${univDetails.address}`).openPopup();
            }
        }

        function applyLocationFilter() {
            globalSelectedUnivId = document.getElementById('univSelect').value;
            toggleFilter(); 
            performSearch(); 
        }
    </script>
</body>
</html>
