<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Reuse - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Red Hat Display', sans-serif;
            background-color: #FDFCE5;
        }
        .input-field {
            background-color: #EBEAD2;
            border: none;
        }
        .btn-primary {
            background-color: #062C1E;
        }
        .body, html {
            scrollbar-width: none;
        }
        .bg-dark-green {
            background-color: #062C1E;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen items-center justify-center px-8 relative">

    <div id="custom-alert" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-6">
        <div class="bg-[#FDFCE5] w-full max-w-xs rounded-[35px] p-6 text-center border-2 border-[#062C1E]/10 shadow-2xl scale-95 transition-all">
            <div class="w-12 h-12 bg-[#EBEAD2] rounded-full flex items-center justify-center mx-auto mb-4 text-dark-green">
                <i data-lucide="info" id="alert-icon" class="w-6 h-6"></i>
            </div>
            <h3 id="alert-title" class="font-bold text-dark-green text-lg mb-2">Notification</h3>
            <p id="alert-message" class="text-xs text-gray-500 leading-relaxed mb-6">Message content goes here.</p>
            <button id="alert-btn" class="w-full bg-dark-green text-white font-bold py-3.5 rounded-2xl text-xs tracking-widest active:scale-95 transition-all">
                OKAY
            </button>
        </div>
    </div>
    <div class="text-center mb-10">
        <div class="flex items-center justify-center gap-2 mb-4">
            <img src="logo.png" alt="logo" class="w-6">
            <h1 class="text-2xl font-bold text-[#062C1E]">Campus Reuse</h1>
        </div>
        <h2 class="text-4xl font-bold text-gray-900 mb-2">Welcome back</h2>
        <p class="text-gray-600">Continue your sustainable journey</p>
    </div>

    <form id="loginForm" class="w-full max-w-sm space-y-6">
        <div>
            <label class="block text-sm font-bold text-gray-700 mb-2 ml-1">Email address</label>
            <input type="email" id="email" placeholder="Use Campus Email" required
                class="input-field w-full p-4 rounded-3xl focus:outline-none focus:ring-2 focus:ring-[#062C1E] transition">
        </div>

        <div class="relative">
            <div class="flex justify-between mb-2 ml-1">
                <label class="text-sm font-bold text-gray-700">Password</label>
                <a href="#" class="text-sm font-bold text-gray-900">Forgot?</a>
            </div>
            <input type="password" id="password" placeholder="••••••••" required
                class="input-field w-full p-4 rounded-3xl focus:outline-none focus:ring-2 focus:ring-[#062C1E] transition">
            <i data-lucide="eye" class="absolute right-4 bottom-4 w-5 h-5 text-gray-500 cursor-pointer"></i>
        </div>

        <button type="submit" class="btn-primary w-full text-white font-bold py-4 rounded-full flex items-center justify-center gap-2 mt-4 hover:opacity-90 transition">
            Sign In <i data-lucide="arrow-right" class="w-5 h-5"></i>
        </button>
    </form>

    <div class="w-full max-w-sm mt-12">
        <div class="relative flex py-5 items-center">
            <div class="flex-grow border-t border-gray-300"></div>
            <span class="flex-shrink mx-4 text-gray-400 text-xs font-bold uppercase tracking-widest">Or Social Login</span>
            <div class="flex-grow border-t border-gray-300"></div>
        </div>

        <div class="flex gap-4 mt-4">
            <button class="flex-1 bg-white border border-gray-100 py-4 rounded-3xl flex items-center justify-center gap-3 shadow-sm hover:bg-gray-50 transition">
                <img src="https://www.gstatic.com/images/branding/product/1x/googleg_48dp.png" class="w-5 h-5" alt="Google">
                <span class="font-bold text-sm">Google</span>
            </button>
            <button class="flex-1 bg-white border border-gray-100 py-4 rounded-3xl flex items-center justify-center gap-3 shadow-sm hover:bg-gray-50 transition">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" class="w-5 h-5" alt="Microsoft">
                <span class="font-bold text-sm">Microsoft</span>
            </button>
        </div>
    </div>

    <p class="mt-12 text-sm text-gray-600">
        Don't have an account? <a href="signup.html" class="font-bold text-gray-900">Create Account</a>
    </p>

    <script src="db.js"></script>

    <script>
        // --- LOGIK ALERT CUSTOM VIA CALLBACK ---
        function showAlert(message, title = "Notification", iconName = "info", callback = null) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            
            const iconEl = document.getElementById('alert-icon');
            if (iconEl) iconEl.setAttribute('data-lucide', iconName);

            const overlay = document.getElementById('custom-alert');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            lucide.createIcons();

            const alertButton = document.getElementById('alert-btn');
            alertButton.onclick = function() {
                closeAlert();
                if (callback && typeof callback === 'function') {
                    callback();
                }
            };
        }

        function closeAlert() {
            const overlay = document.getElementById('custom-alert');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
        }

        // 1. Cek status login & cek parameter URL (Redirect dari logout)
        window.onload = () => {
            lucide.createIcons();

            if (getCurrentUser()) {
                window.location.href = 'home.html';
                return;
            }

            // DETEKSI LOGOUT: Cek apakah mendarat di sini karena klik tombol logout
            const params = new URLSearchParams(window.location.search);
            if (params.get('status') === 'logout') {
                showAlert("Anda telah berhasil keluar dari sistem.", "Logged Out", "log-out");
            }
        };

        // 2. Handle Login Submit
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const emailInput = document.getElementById('email').value.toLowerCase();
            const passwordInput = document.getElementById('password').value;

            if (emailInput.endsWith('.ac.id')) {
                const users = getUsers();
                const user = users.find(u => u.email.toLowerCase() === emailInput && u.password === passwordInput);

                if (user) {
                    const sessionWrapper = {
                        userData: user,
                        loginTime: Date.now()
                    };
                    localStorage.setItem('cm_current_session', JSON.stringify(sessionWrapper));
                    
                    // Tampilkan custom popup dulu, setelah diklik OK baru redirect
                    showAlert(`Selamat datang kembali, ${user.name}!`, "Login Success", "check-circle", function() {
                        window.location.href = 'home.html';
                    });
                } else {
                    showAlert("Email atau Password salah. Silakan coba lagi.", "Login Failed", "alert-circle");
                }
            } else {
                showAlert("Mohon gunakan email resmi kampus (.ac.id)", "Invalid Email", "shield-alert");
            }
        });
    </script>
</body>
</html>
