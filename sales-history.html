<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Reuse - Sales History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Red Hat Display', sans-serif; background-color: #FDFCE5; }
        .bg-cream-input { background-color: #EBEAD2; }
        .text-dark-green { color: #062C1E; }
        .bg-dark-green { background-color: #062C1E; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen relative pb-24 overflow-x-hidden">

    <header class="p-6 flex justify-between items-center bg-[#FDFCE5] sticky top-0 z-50">
        <button onclick="window.location.href='profile.html'" class="p-2 bg-[#EBEAD2] rounded-full text-dark-green"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
        <h1 class="text-lg font-bold text-dark-green">Sales History</h1>
        <div class="w-9"></div> </header>

    <main class="px-6">
        <div class="w-full bg-dark-green rounded-[35px] p-6 mb-8 text-white shadow-xl relative overflow-hidden">
            <div class="absolute -right-6 -top-6 opacity-10"><i data-lucide="trending-up" class="w-32 h-32"></i></div>
            <p class="text-xs text-gray-300 font-bold uppercase tracking-widest mb-1">Total Earnings</p>
            <h2 class="text-4xl font-bold mb-4" id="total-earnings">$0.00</h2>
            <div class="flex items-center gap-2 text-sm font-medium">
                <i data-lucide="check-circle-2" class="w-4 h-4 text-[#D4E89C]"></i>
                <span id="total-sales">0 items sold</span>
            </div>
        </div>

        <div class="flex justify-between items-center mb-6">
            <h3 class="font-bold text-dark-green text-lg">Transaction List</h3>
            <button class="text-[10px] font-bold text-gray-400 uppercase tracking-widest flex items-center gap-1">Filter <i data-lucide="filter" class="w-3 h-3"></i></button>
        </div>

        <div id="sales-container" class="space-y-4">
            </div>
    </main>

    <script src="db.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const currentUser = getCurrentUser();
            
            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }

            renderSalesHistory(currentUser);
        });

        function renderSalesHistory(currentUser) {
            const allProducts = getProducts();
            const allOrders = getOrders();

            // 1. Cari produk mana saja yang dijual oleh user ini
            const myProducts = allProducts.filter(p => p.seller_id === currentUser.id);
            
            // 2. Cari order yang mengandung produk milik user ini
            const mySales = allOrders.filter(order => myProducts.some(p => p.id === order.product_id));

            const container = document.getElementById('sales-container');
            container.innerHTML = '';

            // Jika belum ada penjualan
            if (mySales.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 bg-white/50 rounded-[35px] border border-gray-200">
                        <div class="w-16 h-16 bg-[#EBEAD2] rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="inbox" class="w-8 h-8 text-gray-400"></i>
                        </div>
                        <h4 class="font-bold text-dark-green mb-1">No Sales Yet</h4>
                        <p class="text-gray-400 text-xs font-medium">Your sold items will appear here.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            let totalEarnings = 0;
            let totalSold = 0;

            mySales.forEach(order => {
                const product = myProducts.find(p => p.id === order.product_id);
                
                // Hitung total hanya untuk barang yang statusnya sudah 'collected' (selesai)
                if (order.status === 'collected') {
                    totalEarnings += product.price;
                    totalSold++;
                }

                // Styling berdasarkan status
                const isCompleted = order.status === 'collected';
                const statusColor = isCompleted ? 'text-green-700 bg-[#D4E89C]' : 'text-orange-600 bg-orange-100';
                const statusIcon = isCompleted ? 'check' : 'clock';
                const statusText = isCompleted ? 'Collected' : 'Ongoing';

                container.innerHTML += `
                    <div class="bg-white rounded-[30px] p-4 shadow-sm flex gap-4 items-center active:scale-95 transition-transform cursor-pointer">
                        <div class="w-20 h-20 rounded-[20px] bg-gray-100 overflow-hidden shrink-0">
                            <img src="${product.image}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1">
                            <div class="flex justify-between items-start mb-1">
                                <h4 class="font-bold text-sm text-dark-green leading-tight max-w-[130px] truncate">${product.name}</h4>
                                <span class="font-bold text-sm text-dark-green">$${product.price}</span>
                            </div>
                            <p class="text-[10px] text-gray-400 mb-2 font-medium">Order ${order.order_no} • ${order.date}</p>
                            <span class="inline-flex items-center gap-1 text-[8px] font-bold px-2 py-1 rounded-lg uppercase tracking-wider ${statusColor}">
                                <i data-lucide="${statusIcon}" class="w-3 h-3"></i> ${statusText}
                            </span>
                        </div>
                    </div>
                `;
            });

            // Update Header Angka
            document.getElementById('total-earnings').innerText = `$${totalEarnings.toFixed(2)}`;
            document.getElementById('total-sales').innerText = `${totalSold} items completed`;

            lucide.createIcons();
        }
    </script>
</body>
</html>
