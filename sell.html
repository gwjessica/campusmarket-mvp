<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listing - CampusMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Red Hat Display', sans-serif; background-color: #FDFCE5; }
        .bg-cream-input { background-color: #EBEAD2; }
        .text-dark-green { color: #062C1E; }
        .bg-dark-green { background-color: #062C1E; }
        .active-plus { background-color: #062C1E; color: white; border-radius: 9999px; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen relative pb-40">

    <header class="p-6 flex justify-between items-center bg-[#FDFCE5] sticky top-0 z-50">
        <button onclick="window.location.href='home.html'" class="text-xl text-dark-green">←</button>
        <h1 class="text-lg font-bold text-dark-green">Listing</h1>
        <button onclick="window.location.href='home.html'" class="text-xl text-dark-green">✕</button>
    </header>

    <main class="px-8">
        <h2 class="text-4xl font-bold text-dark-green mb-3">Sell an Item</h2>
        <p class="text-sm text-gray-500 mb-8">Extend the lifecycle of your pre-loved goods.</p>

        <form id="sellForm" class="space-y-6">
            
            <div>
                <label class="text-[10px] font-bold text-gray-900 uppercase tracking-widest ml-1">Product Imagery</label>
                <div class="mt-2 border-2 border-dashed border-gray-300 rounded-[40px] h-52 flex flex-col items-center justify-center bg-white/20 hover:bg-white/40 transition-all cursor-pointer">
                    <div class="text-3xl text-gray-400 mb-2">＋</div>
                    <p class="font-bold text-sm text-gray-800">Upload Photos</p>
                    <p class="text-[10px] text-gray-400 mt-1">High-quality JPG or PNG up to 10MB</p>
                </div>
            </div>

            <div>
                <label class="text-[10px] font-bold text-gray-900 uppercase tracking-widest ml-1">Product Name</label>
                <input type="text" id="name" placeholder="e.g. Minimalist Oak Desk Lamp" required
                    class="w-full bg-cream-input p-5 rounded-[25px] mt-2 focus:outline-none placeholder-gray-400 font-medium text-sm">
            </div>

            <div>
                <label class="text-[10px] font-bold text-gray-900 uppercase tracking-widest ml-1">Description</label>
                <textarea id="description" rows="5" placeholder="Describe the condition, dimensions, and unique features..."
                    class="w-full bg-cream-input p-5 rounded-[30px] mt-2 focus:outline-none placeholder-gray-400 font-medium text-sm"></textarea>
            </div>

            <div>
                <label class="text-[10px] font-bold text-gray-900 uppercase tracking-widest ml-1">Category</label>
                <div class="relative">
                    <select id="category" class="w-full bg-cream-input p-5 rounded-[25px] mt-2 focus:outline-none font-medium text-sm appearance-none cursor-pointer text-gray-500">
                        <option value="" disabled selected>Select category</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Books">Books</option>
                        <option value="Furniture">Furniture</option>
                    </select>
                    <span class="absolute right-6 top-[26px] pointer-events-none text-gray-500">▼</span>
                </div>
            </div>

            <div>
                <label class="text-[10px] font-bold text-gray-900 uppercase tracking-widest ml-1">Price ($)</label>
                <input type="number" id="price" placeholder="0.00" required
                    class="w-full bg-cream-input p-5 rounded-[25px] mt-2 focus:outline-none placeholder-gray-400 font-medium text-sm">
            </div>

            <div>
                <label class="text-[10px] font-bold text-gray-900 uppercase tracking-widest ml-1">Location</label>
                <div class="flex items-center gap-3 mt-3 ml-1 text-sm font-medium text-gray-600">
                    <span class="text-lg">📍</span> Petra Christian University
                </div>
            </div>

            <div class="bg-[#E5E7D0]/60 p-6 rounded-[35px] flex gap-4 items-start border border-white/20">
                <span class="text-xl">ⓘ</span>
                <div class="text-[11px] leading-relaxed text-gray-600">
                    <p class="font-bold text-dark-green mb-1">Sustainability Policy</p>
                    Listing items helps reduce waste. Your listing will be reviewed for quality compliance before appearing in the feed.
                </div>
            </div>

            <button type="submit" class="w-full bg-dark-green text-white font-bold py-5 rounded-full flex justify-center items-center gap-2 shadow-xl hover:opacity-95 transition-all mt-4">
                Place Sell Product <span class="mx-1 text-gray-400">|</span> <span class="text-sm font-medium">Fee $2.00</span>
            </button>

        </form>
    </main>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-[#EBEAD2]/80 backdrop-blur-md rounded-full p-2 flex justify-between items-center shadow-2xl z-40 border border-white/20">
        <button onclick="window.location.href='home.html'" class="p-4 text-gray-600 text-xl">🏠</button>
        <button onclick="window.location.href='messages.html'" class="p-4 text-gray-600 text-xl">💬</button>
        <button onclick="window.location.href='orders.html'" class="p-4 text-gray-600 text-xl">📋</button>
        <button class="p-3 bg-dark-green text-white rounded-full text-2xl flex items-center justify-center w-14 h-14">➕</button>
        <button onclick="window.location.href='profile.html'" class="p-4 text-gray-600 text-xl">👤</button>
    </nav>

    <script src="db.js"></script>
    <script>
        if (!getCurrentUser()) {
            window.location.href = 'login.html';
        }
        
        // 1. PROTEKSI HALAMAN: Cek apakah ada user yang login
        const currentUser = getCurrentUser();
        
        if (!currentUser) {
            // Kalau nggak ada session, lempar balik ke login
            alert("Waduh, kamu harus login dulu pakai email @ac.id!");
            window.location.href = 'login.html';
        }

        document.getElementById('sellForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const nameValue = document.getElementById('name').value;
            const priceValue = document.getElementById('price').value;
            const descValue = document.getElementById('description').value || "Eco-friendly used item.";
            const catValue = document.getElementById('category').value;

            if(!catValue) {
                alert("Please select a category first!");
                return;
            }

            // Kita siapkan objek produknya
            // Seller_id tidak perlu ditulis di sini karena sudah dihandle di addProduct (db.js)
            const newProduct = {
                name: nameValue,
                price: parseFloat(priceValue),
                desc: descValue.length > 50 ? descValue.substring(0, 50) + "..." : descValue,
                category: catValue,
                image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500",
                tag: "NEW LISTING",
                location: currentUser.univ // Pakai univ si user yang lagi login
            };

            // 2. Panggil fungsi addProduct dari db.js
            if (typeof addProduct === "function") {
                addProduct(newProduct); 
                
                // Log untuk mastiin (bisa dihapus nanti)
                console.log("Produk diposting oleh:", currentUser.name);
                
                alert(`Success! Item kamu sudah terdaftar atas nama ${currentUser.name}`);
                window.location.href = 'home.html';
            } else {
                console.error("db.js is not loaded correctly.");
            }
        });
    </script>
</body>
</html>
