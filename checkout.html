<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - CampusMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Red Hat Display', sans-serif; background-color: #FDFCE5; }
        .bg-cream-card { background-color: #EBEAD2; }
        .text-dark-green { color: #062C1E; }
        .bg-dark-green { background-color: #062C1E; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen pb-32">

    <header class="p-8 flex justify-between items-center">
        <h1 class="text-xl font-bold text-dark-green tracking-widest uppercase">Checkout</h1>
        <span class="text-xl">🛍️</span>
    </header>

    <main class="px-6">
        <h3 class="font-bold text-lg mb-4">Order Summary</h3>
        
        <div class="bg-cream-card/50 rounded-[40px] p-6 mb-8 flex gap-5 items-center">
            <img id="checkout-img" src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=300" 
                 class="w-24 h-24 rounded-2xl object-cover bg-black">
            <div>
                <h4 class="font-bold text-dark-green text-sm" id="checkout-name">Silence Pro Wireless</h4>
                <p class="text-[10px] text-gray-400 font-bold mt-1">📍 Petra Christian University</p>
                <p class="font-bold text-dark-green mt-3 text-lg" id="checkout-price">$180.00</p>
            </div>
        </div>

        <h3 class="font-bold text-lg mb-4">Payment Methods</h3>

        <div class="bg-cream-card/30 rounded-[40px] p-6 mb-4">
            <div class="flex items-center gap-2 mb-4">
                <span class="text-lg">🏛️</span>
                <span class="text-xs font-bold uppercase tracking-widest">Bank Transfer</span>
            </div>
            <div class="space-y-3">
                <label class="flex justify-between items-center bg-cream-card/60 p-4 rounded-2xl cursor-pointer">
                    <span class="text-sm font-medium">BCA Transfer</span>
                    <input type="radio" name="pay" class="w-5 h-5 accent-dark-green" checked>
                </label>
                <label class="flex justify-between items-center bg-cream-card/60 p-4 rounded-2xl cursor-pointer">
                    <span class="text-sm font-medium">Mandiri Transfer</span>
                    <input type="radio" name="pay" class="w-5 h-5 accent-dark-green">
                </label>
            </div>
        </div>

        <div class="bg-cream-card/30 rounded-[40px] p-6 mb-8">
            <div class="flex items-center gap-2 mb-4">
                <span class="text-lg">💳</span>
                <span class="text-xs font-bold uppercase tracking-widest">E-Wallets</span>
            </div>
            <div class="flex gap-4">
                <div class="flex-1 bg-cream-card/60 p-4 rounded-2xl flex flex-col items-center gap-3">
                    <span class="bg-[#D4E89C] text-[8px] font-bold px-2 py-1 rounded text-green-800">OVO</span>
                    <input type="radio" name="pay" class="w-4 h-4 accent-dark-green">
                </div>
                <div class="flex-1 bg-cream-card/60 p-4 rounded-2xl flex flex-col items-center gap-3">
                    <span class="bg-dark-green text-white text-[8px] font-bold px-2 py-1 rounded">GP</span>
                    <input type="radio" name="pay" class="w-4 h-4 accent-dark-green">
                </div>
                <div class="flex-1 bg-cream-card/60 p-4 rounded-2xl flex flex-col items-center gap-3">
                    <span class="bg-blue-100 text-blue-600 text-[8px] font-bold px-2 py-1 rounded">DN</span>
                    <input type="radio" name="pay" class="w-4 h-4 accent-dark-green">
                </div>
            </div>
        </div>

        <div class="bg-cream-card/50 rounded-[45px] p-8 mb-4">
            <div class="space-y-3 mb-6">
                <div class="flex justify-between text-gray-500 text-sm font-medium">
                    <span>Product Price</span>
                    <span class="text-black font-bold">$180.00</span>
                </div>
                <div class="flex justify-between text-gray-500 text-sm font-medium">
                    <span>Admin Fee</span>
                    <span class="text-black font-bold">$2.00</span>
                </div>
            </div>
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Total Payment</p>
                    <p class="text-3xl font-bold text-dark-green">$182.00</p>
                </div>
                <button onclick="processPayment()" class="bg-dark-green text-white px-10 py-4 rounded-full font-bold shadow-xl active:scale-95 transition-all">
                    Pay Now
                </button>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-[#EBEAD2]/80 backdrop-blur-md rounded-full p-2 flex justify-between items-center shadow-2xl z-40 border border-white/20">
        <button onclick="window.location.href='home.html'" class="p-4 text-gray-400 text-xl">🏠</button>
        <button onclick="window.location.href='messages.html'" class="p-4 text-gray-400 text-xl">💬</button>
        <button class="p-3 bg-dark-green text-white rounded-full text-xl flex items-center justify-center w-14 h-14">
            <span class="text-xs font-bold">📋</span>
        </button>
        <button onclick="window.location.href='sell.html'" class="p-4 text-gray-400 text-xl">＋</button>
        <button class="p-4 text-gray-400 text-xl">👤</button>
    </nav>

    <script>
        function processPayment() {
            alert("Payment Successful! Redirecting to your orders...");
            window.location.href = 'orders.html?tab=ongoing';
        }
    </script>
</body>
</html>
