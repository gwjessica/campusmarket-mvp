<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - CampusMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Red Hat Display', sans-serif; background-color: #FDFCE5; }
        .bg-cream-input { background-color: #EBEAD2; }
        .bg-dark-green { background-color: #062C1E; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen">

    <header class="p-6 flex items-center gap-4">
        <button onclick="window.history.back()" class="text-xl">←</button>
        <h1 class="text-lg font-bold text-[#062C1E]">Edit Profile</h1>
    </header>

    <main class="px-8 pt-4">
        <div class="flex flex-col items-center mb-10">
            <div class="relative">
                <img id="display-avatar" src="" class="w-24 h-24 rounded-[30px] object-cover border-4 border-white shadow-sm">
                <button class="absolute -bottom-2 -right-2 bg-dark-green text-white p-2 rounded-full text-xs">📷</button>
            </div>
        </div>

        <form id="editProfileForm" class="space-y-6">
            <div>
                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">Full Name / Username</label>
                <input type="text" id="new-name" required
                    class="w-full bg-cream-input p-4 rounded-3xl mt-2 focus:outline-none font-medium text-sm">
            </div>

            <div>
                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-1">University (Read Only)</label>
                <input type="text" id="display-univ" disabled
                    class="w-full bg-gray-200/50 p-4 rounded-3xl mt-2 focus:outline-none font-medium text-sm text-gray-400">
            </div>

            <div class="pt-10">
                <button type="submit" class="w-full bg-dark-green text-white font-bold py-5 rounded-full shadow-xl active:scale-95 transition-all">
                    Save Changes
                </button>
            </div>
        </form>
    </main>

    <script src="db.js"></script>
    <script>
        const user = getCurrentUser();

        // Load data lama ke form
        window.onload = () => {
            if (!user) window.location.href = 'login.html';
            
            document.getElementById('new-name').value = user.name;
            document.getElementById('display-univ').value = user.univ;
            document.getElementById('display-avatar').src = user.avatar;
        };

        document.getElementById('editProfileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const updatedName = document.getElementById('new-name').value;

            // Panggil fungsi update dari db.js
            updateUser({ name: updatedName });

            alert("Nama berhasil diganti jadi: " + updatedName);
            window.location.href = 'profile.html';
        });
    </script>
</body>
</html>
