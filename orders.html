<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Reuse - Orders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Red Hat Display', sans-serif; background-color: #FDFCE5; }
        .bg-dark-green { background-color: #062C1E; }
        .text-dark-green { color: #062C1E; }
        .tab-active { background-color: white; color: #062C1E; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .body, html {
            scrollbar-width: none;
        }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen relative pb-32">

    <header class="p-6 flex justify-between items-center bg-[#FDFCE5] sticky top-0 z-50">
        <button onclick="window.location.href='home.html'"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
        <h1 class="text-lg font-bold text-dark-green uppercase tracking-widest">Orders</h1>
        <button><i data-lucide="search" class="w-5 h-5"></i></button>
    </header>

    <div class="px-6 mb-8">
        <div class="bg-[#EBEAD2]/50 p-1.5 rounded-full flex justify-between">
            <button onclick="switchTab('topay')" id="btn-topay" class="flex-1 py-3 rounded-full text-xs font-bold text-gray-400 transition-all">To Pay</button>
            <button onclick="switchTab('ongoing')" id="btn-ongoing" class="flex-1 py-3 rounded-full text-xs font-bold text-gray-400 transition-all">Ongoing</button>
            <button onclick="switchTab('collected')" id="btn-collected" class="flex-1 py-3 rounded-full text-xs font-bold text-gray-400 transition-all">Collected</button>
        </div>
    </div>

    <main class="px-6" id="orders-container">
        

    </main>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-[#EBEAD2]/80 backdrop-blur-md rounded-full p-2 flex justify-between items-center shadow-2xl z-40 border border-white/20">
        <button onclick="window.location.href='home.html'" class="p-4 text-gray-600"><i data-lucide="home" class="w-5 h-5"></i></button>
        <button onclick="window.location.href='messages.html'" class="p-4 text-gray-600"><i data-lucide="message-circle" class="w-5 h-5"></i></button>
        <button class="p-3 bg-dark-green text-white rounded-full flex items-center justify-center w-14 h-14"><i data-lucide="clipboard-list" class="w-5 h-5"></i></button>
        <button onclick="window.location.href='sell.html'" class="p-4 text-gray-600"><i data-lucide="plus" class="w-5 h-5"></i></button>
        <button onclick="window.location.href='profile.html'" class="p-4 text-gray-600"><i data-lucide="user" class="w-5 h-5"></i></button>
    </nav>

    <script src="db.js"></script>
    <script>
        function renderOrders(tabName) {
            const currentUser = getCurrentUser();
            if (!currentUser) return window.location.href = 'login.html';

            const allOrders = getOrders();
            const allProducts = getProducts();
            const allReviews = getReviews() || []; // Ambil dari db.js
            const container = document.getElementById('orders-container');
            
            // Filter: Hanya order milik user yang login DAN statusnya cocok dengan tab
            const filteredOrders = allOrders.filter(o => o.user_id === currentUser.id && o.status === tabName);

            if (filteredOrders.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 mt-10">No orders here yet.</p>`;
                return;
            }

            container.innerHTML = ''; // Clear container

            filteredOrders.forEach(order => {
                const product = allProducts.find(p => p.id === order.product_id);
                if (!product) return;

                let cardHTML = '';

                // TO PAY
                if (tabName === 'topay') {
                    cardHTML = `
                        <div class="bg-white/40 rounded-[45px] p-6 border border-white/40 mb-6">
                            <img src="${product.image}" class="w-full aspect-square object-cover rounded-[35px] mb-6">
                            <div class="flex justify-between items-start mb-1">
                                <h4 class="text-2xl font-bold text-dark-green w-2/3">${product.name}</h4>
                                <span class="bg-[#D4E89C] text-[8px] font-bold px-3 py-1.5 rounded-full text-green-900">PENDING PAYMENT</span>
                            </div>
                            <p class="text-3xl font-bold text-dark-green mb-1">${formatRupiah(product.price)}</p>
                            <p class="text-[10px] text-gray-400 font-bold mb-8"><i data-lucide="map-pin" class="w-3 h-3 inline mr-1"></i>${product.location || 'Surabaya'}</p>
                            <div class="space-y-4">
                                <button onclick="payOrder('${order.id}')" class="w-full bg-dark-green text-white font-bold py-5 rounded-full shadow-lg active:scale-95 transition-transform">Pay Now</button>
                            </div>
                        </div>
                    `;
                } 
                // ONGOING
                else if (tabName === 'ongoing') {
                    cardHTML = `
                        <div class="bg-cream-card/40 rounded-[45px] p-8 mb-6">
                            <div class="flex gap-5 mb-8">
                                <img src="${product.image}" class="w-20 h-20 rounded-2xl object-cover bg-black">
                                <div class="flex-1">
                                    <h4 class="font-bold text-dark-green text-lg leading-tight mb-1">${product.name}</h4>
                                    <p class="text-[10px] text-gray-400 font-bold">Order ${order.order_no}</p>
                                    <div class="flex justify-between items-end mt-2">
                                        <span class="font-bold text-lg">${formatRupiah(product.price)}</span>
                                        <span class="bg-[#D4E89C] text-[8px] font-bold px-2 py-1 rounded-full text-green-800 uppercase">Active</span>
                                    </div>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-4 mb-8">
                                <div class="bg-white/60 p-5 rounded-3xl"><p class="text-[9px] font-bold text-gray-400 uppercase mb-1">Date</p><p class="font-bold text-sm">${order.date}</p></div>
                                <div class="bg-white/60 p-5 rounded-3xl"><p class="text-[9px] font-bold text-gray-400 uppercase mb-1">Status</p><p class="font-bold text-sm text-green-700">● Ready for Pickup</p></div>
                            </div>
                            <div onclick="completeOrder('${order.id}')" class="bg-dark-green p-2 rounded-full flex items-center relative cursor-pointer group active:scale-95 transition-transform">
                                <div class="bg-white w-12 h-12 rounded-full flex items-center justify-center text-dark-green shadow-lg z-10"><i data-lucide="check" class="w-5 h-5"></i></div>
                                <p class="text-white text-[10px] font-bold tracking-widest absolute inset-0 flex items-center justify-center pl-6">CLICK TO COMPLETE</p>
                            </div>
                        </div>
                    `;
                } 
                // COLLECTED
                else { 
                    // Cek apakah order ini sudah punya review
                    const hasReview = allReviews.some(r => r.order_id === order.id);
                    
                    cardHTML = `
                        <div class="bg-white/40 rounded-[35px] p-4 flex flex-col mb-4 border border-white/60 shadow-sm">
                            <div class="flex gap-4 items-center w-full">
                                <img src="${product.image}" class="w-20 h-20 rounded-2xl object-cover bg-black">
                                <div class="flex-1">
                                    <div class="flex justify-between items-start">
                                        <span class="text-[8px] font-bold text-green-800 bg-[#D4E89C] px-2 py-0.5 rounded-md uppercase">Collected</span>
                                        <span class="text-[8px] font-bold text-gray-400 uppercase">${order.date}</span>
                                    </div>
                                    <h4 class="font-bold text-dark-green text-sm mt-1 leading-tight">${product.name}</h4>
                                    <p class="font-bold text-lg mt-1">${formatRupiah(product.price)}</p>
                                </div>
                            </div>
                            
                            ${!hasReview ? `
                            <div id="rating-ui-${order.id}" class="mt-4 pt-4 border-t border-gray-200/60 w-full">
                                <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2 text-center">How would you rate your experience?</p>
                                <div class="flex justify-center gap-2 text-gray-300">
                                    <button onclick="submitRating('${order.id}', '${product.seller_id}', 1)" class="hover:text-yellow-400 hover:fill-yellow-400 transition-colors"><i data-lucide="star" class="w-6 h-6"></i></button>
                                    <button onclick="submitRating('${order.id}', '${product.seller_id}', 2)" class="hover:text-yellow-400 hover:fill-yellow-400 transition-colors"><i data-lucide="star" class="w-6 h-6"></i></button>
                                    <button onclick="submitRating('${order.id}', '${product.seller_id}', 3)" class="hover:text-yellow-400 hover:fill-yellow-400 transition-colors"><i data-lucide="star" class="w-6 h-6"></i></button>
                                    <button onclick="submitRating('${order.id}', '${product.seller_id}', 4)" class="hover:text-yellow-400 hover:fill-yellow-400 transition-colors"><i data-lucide="star" class="w-6 h-6"></i></button>
                                    <button onclick="submitRating('${order.id}', '${product.seller_id}', 5)" class="hover:text-yellow-400 hover:fill-yellow-400 transition-colors"><i data-lucide="star" class="w-6 h-6"></i></button>
                                </div>
                            </div>
                            ` : `
                            <div class="mt-4 pt-4 border-t border-gray-200/60 w-full flex justify-center items-center gap-1 text-yellow-400">
                                <i data-lucide="check-circle-2" class="w-4 h-4 text-green-500"></i>
                                <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest ml-1">Rating Submitted</span>
                            </div>
                            `}
                        </div>
                    `;
                }
                container.innerHTML += cardHTML;
            });
            lucide.createIcons(); // Panggil setelah merender semua
        }

        // --- FUNGSI SUBMIT RATING ---
        function submitRating(orderId, sellerId, score) {
            // Gunakan fungsi addReview yang ada di db.js
            addReview(orderId, sellerId, score, "Great transaction!"); 
            
            // Re-render tab collected agar form rating hilang dan muncul tanda centang
            renderOrders('collected');
        }

        // --- FUNGSI SIMULASI TRANSAKSI ---
        function payOrder(id) {
            updateOrderStatus(id, 'ongoing');
            alert("Payment success! Item is now ongoing.");
            switchTab('ongoing');
        }

        function completeOrder(id) {
            updateOrderStatus(id, 'collected');
            alert("Item collected! Transaction finished.");
            switchTab('collected');
        }

        function switchTab(tabName) {
            document.querySelectorAll('#btn-topay, #btn-ongoing, #btn-collected').forEach(b => b.classList.remove('tab-active'));
            document.getElementById('btn-' + tabName).classList.add('tab-active');
            renderOrders(tabName);
        }

        // --- INIT ---
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const activeTab = params.get('tab') || 'topay';
            switchTab(activeTab);
        };
    </script>
</body>
</html>
