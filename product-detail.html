<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Campus Reuse - Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Red Hat Display', sans-serif; background-color: #FDFCE5; }
        .bg-box { background-color: #EBEAD2; }
        .bg-dark-green { background-color: #062C1E; }
        .text-dark-green { color: #062C1E; }
        .body, html {
            scrollbar-width: none;
        }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen relative pb-32">

    <header class="p-6 flex justify-between items-center fixed top-0 w-full max-w-md z-30 bg-[#FDFCE5]/80 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <button onclick="window.history.back()"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
            <img src="logo.png" alt="logo" class="h-6 w-6">
            <h1 class="text-lg font-bold text-dark-green flex items-center gap-1 italic">
                Campus Reuse
            </h1>
        </div>
        <div class="flex gap-4">
            <button class=""><i data-lucide="heart" class="w-5 h-5"></i></button>
            <button class=""><i data-lucide="link" class="w-5 h-5"></i></button>
        </div>
    </header>

    <main class="px-6 pt-24" id="content-area">
        <div class="relative w-full aspect-square bg-[#1A1A1A] rounded-[40px] overflow-hidden mb-8 shadow-xl">
            <img id="p-img" src="" class="w-full h-full object-cover opacity-90" alt="Product">
            
            <div class="absolute top-6 left-6 flex gap-2">
                <span id="p-tag" class="bg-[#D4E89C] text-[10px] font-bold px-3 py-1 rounded-full text-green-900 uppercase">TAG</span>
                <span class="bg-[#EBEAD2] text-[10px] font-bold px-3 py-1 rounded-full text-gray-700">SUSTAINABLE</span>
            </div>
            
            <div class="absolute bottom-6 w-full text-center">
                <p id="p-subname" class="text-white/50 text-[10px] font-bold tracking-widest uppercase"></p>
            </div>
        </div>

        <div class="mb-8">
            <h2 id="p-title" class="text-3xl font-bold text-dark-green mb-2"></h2>
            <p id="p-desc" class="text-sm text-gray-500 leading-relaxed mb-3"></p>
            <p class="text-[10px] font-bold text-gray-400 flex items-center gap-1">
                <i data-lucide="map-pin" class="w-3 h-3"></i> <span id="p-location"></span>
            </p>
        </div>

        <div class="bg-[#EBEAD2] rounded-[35px] p-8 mb-8 space-y-3">
            <div class="flex justify-between text-sm font-medium text-gray-500">
                <span>Product Price</span>
                <span id="p-price" class="text-black font-bold text-lg"></span>
            </div>
            <div class="flex justify-between text-sm font-medium text-gray-500">
                <span>Impact Admin Fee</span>
                <span id="p-fee" class="text-black font-bold text-lg"></span>
            </div>
            <hr class="border-gray-300 my-2">
            <div class="flex justify-between items-center pt-2">
                <span class="font-bold text-lg">Total Price</span>
                <span id="p-total" class="font-bold text-2xl text-dark-green"></span>
            </div>
        </div>

        <div class="bg-[#EBEAD2] rounded-[40px] p-8 mb-8 relative overflow-hidden">
            <div class="flex items-start gap-5">
                <div class="relative">
                    <img id="seller-avatar" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200" 
                         class="w-16 h-16 rounded-full object-cover border-2 border-white shadow-sm">
                    <span class="absolute bottom-0 right-0 bg-[#D4E89C] border-2 border-white text-[8px] rounded-full p-1 leading-none">✅</span>
                </div>
                <div>
                    <h4 id="seller-name" class="font-bold text-xl text-dark-green">Julian Green</h4>
                    
                    <div class="flex flex-col gap-1">
                        <div id="seller-stars" class="flex gap-1 text-yellow-400">
                        </div>
                        <p id="seller-rating-text" class="text-[10px] font-bold text-gray-500 uppercase tracking-widest"></p>
                    </div>
                </div>
            </div>
            <button id="view-gallery-btn" class="w-full mt-6 bg-white py-3 rounded-2xl font-bold text-xs shadow-sm active:scale-95 transition-all text-dark-green">View Gallery</button>
        </div>
    </main>

    <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md p-6 bg-[#FDFCE5]/90 backdrop-blur-md flex gap-4 z-40">
        <button id="chat-btn" class="bg-[#D4E89C] p-5 rounded-2xl flex items-center justify-center transition-all active:scale-95">
            <i data-lucide="message-circle" class="w-5 h-5"></i>
        </button>
        <button id="buy-btn" class="flex-1 bg-dark-green text-white font-bold py-5 rounded-2xl text-sm tracking-widest flex justify-center items-center gap-2 active:scale-95 transition-all">
            BUY NOW
        </button>
    </div>

    <script src="db.js"></script>
    <script>
        window.onload = function() {
            // 1. Ambil ID dari URL (?id=123)
            const params = new URLSearchParams(window.location.search);
            const productId = params.get('id');

            // 2. Ambil data dari db.js
            const products = getProducts();
            
            // 3. Cari produk yang ID-nya cocok
            const product = products.find(p => p.id == productId);

            if (product) {
                const seller = findUserById(product.seller_id);

                // Update UI dengan data produk
                document.getElementById('page-title').innerText = `Detail - ${product.name}`;
                document.getElementById('p-img').src = product.image;
                document.getElementById('p-img').alt = product.name;
                document.getElementById('p-tag').innerText = product.tag || "SUSTAINABLE";
                document.getElementById('p-subname').innerText = product.name;
                document.getElementById('p-title').innerText = product.name;
                document.getElementById('p-desc').innerText = product.desc;
                document.getElementById('p-location').innerText = product.location;

                // 3. UPDATE PROFIL PENJUAL & RATING
                if (seller) {
                    document.getElementById('seller-name').innerText = seller.name;
                    document.getElementById('seller-avatar').src = seller.avatar;

                    // Ambil data rating dari db.js
                    const ratingData = getSellerRating(seller.id);
                    const starContainer = document.getElementById('seller-stars');
                    starContainer.innerHTML = '';
                    
                    // Render 5 Bintang
                    const avg = Math.round(ratingData.average);
                    for(let i = 1; i <= 5; i++) {
                        const fill = i <= avg ? '#facc15' : 'none'; 
                        const stroke = i <= avg ? '#facc15' : '#d1d5db'; 
                        starContainer.innerHTML += `<i data-lucide="star" class="w-4 h-4" fill="${fill}" stroke="${stroke}"></i>`;
                    }
                    
                    // Teks detail rating
                    document.getElementById('seller-rating-text').innerText = ratingData.count > 0 
                        ? `${ratingData.average} / 5.0 (${ratingData.count} Reviews)` 
                        : 'No reviews yet';

                    // Update tombol View Gallery
                    document.getElementById('view-gallery-btn').onclick = () => {
                        window.location.href = `seller-gallery.html?id=${seller.id}`;
                    };
                }

                // Hitung Harga
                const price = parseFloat(product.price);
                const fee = 2500; // Contoh fee statis
                const total = price + fee;

                document.getElementById('p-price').innerText = formatRupiah(price);
                document.getElementById('p-fee').innerText = formatRupiah(Math.round(fee));
                document.getElementById('p-total').innerText = formatRupiah(Math.round(total));

                // Update Link Tombol
                document.getElementById('chat-btn').onclick = () => {
                    window.location.href = `chat-detail.html?user=${seller ? seller.name : 'Seller'}&product_id=${product.id}`;
                };
                document.getElementById('buy-btn').onclick = () => {
                    window.location.href = `checkout.html?id=${product.id}`;
                };

            } else {
                // Jika produk tidak ditemukan
                document.getElementById('content-area').innerHTML = `
                    <div class="text-center py-20">
                        <p class="text-gray-400 font-bold">Produk tidak ditemukan.</p>
                        <button onclick="window.history.back()" class="mt-4 text-dark-green underline font-bold">Kembali</button>
                    </div>
                `;
            }

            // PENTING: Panggil Lucide di sini, setelah HTML selesai diubah
            lucide.createIcons();
        };
    </script>
</body>
</html>
