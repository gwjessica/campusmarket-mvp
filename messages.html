<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Reuse - Messages</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Red Hat Display', sans-serif; background-color: #FDFCE5; }
        .bg-dark-green { background-color: #062C1E; }
        .text-dark-green { color: #062C1E; }
        .body, html {
            scrollbar-width: none;
        }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen relative pb-32">

    <header class="p-8">
        <h1 class="text-xl font-bold text-dark-green tracking-widest uppercase">Messages</h1>
    </header>

    <main class="px-6">
        <div class="relative mb-8">
            <input type="text" placeholder="Search conversations..." 
                class="w-full bg-[#EBEAD2] p-4 pl-12 rounded-full focus:outline-none placeholder-gray-500 text-sm font-medium">
            <i data-lucide="search" class="absolute left-5 top-4 w-4 h-4 text-gray-500"></i>
        </div>

        <div class="space-y-4">
            <div onclick="window.location.href='chat-detail.html?user=Julian Green&product_id=1'" 
                 class="bg-[#EBEAD2]/40 p-4 rounded-[35px] flex items-center gap-4 cursor-pointer active:scale-95 transition-all">
                <div class="relative">
                    <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=150" class="w-14 h-14 rounded-full object-cover">
                    <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-600 border-2 border-white rounded-full"></span>
                </div>
                <div class="flex-1">
                    <div class="flex justify-between items-center mb-1">
                        <h4 class="font-bold text-sm">Julian Green</h4>
                        <span class="text-[10px] text-gray-400 font-bold">2m ago</span>
                    </div>
                    <p class="text-xs text-gray-500 truncate w-48">Is the Silence Pro Headphones still available?</p>
                </div>
                <span class="bg-dark-green text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full">1</span>
            </div>

            <div class="bg-white/20 p-4 rounded-[35px] flex items-center gap-4">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=150" class="w-14 h-14 rounded-full object-cover">
                <div class="flex-1">
                    <div class="flex justify-between items-center mb-1">
                        <h4 class="font-bold text-sm">Sarah Miller</h4>
                        <span class="text-[10px] text-gray-400 font-bold">45m ago</span>
                    </div>
                    <p class="text-xs text-gray-400 truncate w-48">The Vintage Camera looks amazin...</p>
                </div>
            </div>
        </div>

        <div class="mt-12 bg-[#EBEAD2]/60 p-10 rounded-[45px] text-center">
            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">New Inquiry?</p>
            <p class="text-sm font-bold text-dark-green leading-relaxed">Browse the curated marketplace to start a conversation.</p>
        </div>
    </main>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-[#EBEAD2]/80 backdrop-blur-md rounded-full p-2 flex justify-between items-center shadow-2xl z-40 border border-white/20">
        <button onclick="window.location.href='home.html'" class="p-4 text-gray-600"><i data-lucide="home" class="w-5 h-5"></i></button>
        <button class="p-3 bg-dark-green text-white rounded-full flex items-center justify-center w-14 h-14"><i data-lucide="message-circle" class="w-5 h-5"></i></button>
        <button onclick="window.location.href='orders.html'" class="p-4 text-gray-600"><i data-lucide="clipboard-list" class="w-5 h-5"></i></button>
        <button onclick="window.location.href='sell.html'" class="p-4 text-gray-600"><i data-lucide="plus" class="w-5 h-5"></i></button>
        <button onclick="window.location.href='profile.html'" class="p-4 text-gray-600"><i data-lucide="user" class="w-5 h-5"></i></button>
    </nav>

    <script src="db.js"></script>
    <script>lucide.createIcons();</script>
    <script>
        if (!getCurrentUser()) {
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
