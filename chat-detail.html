<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - CampusReuse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Red Hat Display', sans-serif; background-color: #FDFCE5; }
        .bg-dark-green { background-color: #062C1E; }
        .text-dark-green { color: #062C1E; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col pb-24 relative">

    <header class="p-6 flex items-center gap-4 bg-[#FDFCE5] sticky top-0 z-50 border-b border-[#EBEAD2]">
        <button onclick="window.location.href='messages.html'"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
        <img id="partner-avatar" src="" class="w-10 h-10 rounded-full object-cover bg-gray-200">
        <div>
            <h1 id="partner-name" class="text-sm font-bold text-dark-green">Loading Partner...</h1>
            <p class="text-[10px] text-green-600 font-bold">● Active Now</p>
        </div>
    </header>

    <div class="px-6 py-3 sticky top-[89px] z-40 bg-[#FDFCE5]/90 backdrop-blur-sm border-b border-[#EBEAD2]/60">
        <div class="bg-white/70 border border-white/60 p-3 rounded-2xl flex items-center justify-between shadow-sm">
            <div class="flex items-center gap-3">
                <img id="prod-img" src="" class="w-10 h-10 rounded-xl object-cover bg-gray-100">
                <div>
                    <h4 id="prod-name" class="font-bold text-xs text-dark-green truncate w-40">Loading Item...</h4>
                    <p id="prod-price" class="text-[11px] font-bold text-gray-500 mt-0.5">$0.00</p>
                </div>
            </div>
            <button id="prod-btn" class="bg-dark-green text-white text-[9px] font-bold px-4 py-2 rounded-xl active:scale-95 transition-transform uppercase tracking-wider">Buy Now</button>
        </div>
    </div>

    <main id="chat-messages-box" class="flex-1 px-6 py-4 space-y-4 overflow-y-auto no-scrollbar">
        </main>

    <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-[#FDFCE5] p-4 border-t border-[#EBEAD2] z-50">
        <form id="chatForm" class="flex items-center gap-3">
            <input type="text" id="chatInput" placeholder="Type a message..." required autocomplete="off"
                class="flex-1 bg-[#EBEAD2]/60 p-4 rounded-full text-sm placeholder-gray-500 font-medium focus:outline-none focus:ring-2 focus:ring-dark-green transition-all">
            <button type="submit" class="bg-dark-green text-white p-4 rounded-full flex items-center justify-center shadow-lg active:scale-95 transition-transform">
                <i data-lucide="send" class="w-4 h-4"></i>
            </button>
        </form>
    </div>

    <script src="db.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const partnerId = params.get('user_id') || 'user_1';
        const productId = params.get('product_id'); // 🟢 Ambil product_id (Bisa ada, bisa null)

        window.onload = () => {
            const currentUser = getCurrentUser();
            if (!currentUser) return window.location.href = 'login.html';

            // 1. Render Profil Lawan Bicara
            const partner = findUserById(partnerId);
            if (partner) {
                document.getElementById('partner-name').innerText = partner.name;
                document.getElementById('partner-avatar').src = partner.avatar;
            }

            // 2. LOGIK FLOATING CARD DINAMIS
            const floatingCard = document.querySelector('.sticky.top-\\[89px\\]'); // Ambil container card
            
            if (productId) {
                // Jika dibuka dari halaman produk, ambil datanya dan tampilkan card
                const product = getProducts().find(p => p.id == productId);
                if (product) {
                    document.getElementById('prod-name').innerText = product.name;
                    document.getElementById('prod-img').src = product.image;
                    document.getElementById('prod-price').innerText = formatRupiah(product.price);
                    
                    document.getElementById('prod-btn').onclick = () => {
                        window.location.href = `checkout.html?id=${product.id}`;
                    };
                } else {
                    if (floatingCard) floatingCard.classList.add('hidden');
                }
            } else {
                // 🟢 Jika dibuka dari tab 'Messages', sembunyikan floating card-nya!
                if (floatingCard) floatingCard.classList.add('hidden');
            }

            renderChatBubble();
        };

        function renderChatBubble() {
            const currentUser = getCurrentUser();
            const allMsgs = getAllMessages();
            const box = document.getElementById('chat-messages-box');
            box.innerHTML = '';

            // 🟢 LOGIK BARU: Filter semua pesan antara Me vs Partner, TANPA memedulikan product_id
            const filtered = allMsgs.filter(m => 
                (m.sender_id === currentUser.id && m.receiver_id === partnerId) || 
                (m.sender_id === partnerId && m.receiver_id === currentUser.id)
            );

            filtered.forEach(msg => {
                const isMe = msg.sender_id === currentUser.id;
                const alignment = isMe ? 'justify-end' : 'justify-start';
                const bubbleBg = isMe ? 'bg-dark-green text-white rounded-br-none' : 'bg-[#EBEAD2] text-dark-green rounded-bl-none';

                box.innerHTML += `
                    <div class="flex ${alignment} w-full">
                        <div class="max-w-[75%] px-4 py-3 rounded-[24px] text-xs font-medium leading-relaxed shadow-sm ${bubbleBg}">
                            ${msg.text}
                        </div>
                    </div>
                `;
            });
            
            box.scrollTop = box.scrollHeight;
            lucide.createIcons();
        }

        // Aksi Kirim Pesan
        document.getElementById('chatForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const text = input.value.trim();

            if (text) {
                // Kirim pesan dengan menyertakan productId saat ini (jika ada konteknya)
                sendMessage(partnerId, productId, text);
                input.value = ''; 
                renderChatBubble(); 
            }
        });
    </script>
</body>
</html>
